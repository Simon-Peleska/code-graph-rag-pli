# Builds cgr with PL/I support as a portable Windows folder: an embeddable
# Python, every dependency as a prebuilt Windows binary, and the PL/I grammar
# compiled here. Unzip and run cgr.cmd; the target machine needs no compiler,
# no uv, no Python install and no admin rights.
name: Windows bundle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/vitali87/code-graph-rag
  UPSTREAM_REV: ed322ab
  # 3.12.10 is the last 3.12 release python.org ships Windows binaries for.
  PYTHON_VERSION: "3.12.10"

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # The runner converts line endings by default, which breaks `git apply`.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Patch upstream
        run: |
          git clone --quiet "$UPSTREAM_REPO" upstream
          cd upstream
          git checkout --quiet "$UPSTREAM_REV"
          git apply --index ../patches/0001-pli-support.patch
          git submodule update --init grammars/tree-sitter-pli grammars/tree-sitter-jcl \
            grammars/tree-sitter-hlasm grammars/tree-sitter-db2

      # The grammars become installed packages, which cgr imports before
      # looking for a checkout, so the bundle never compiles anything.
      - name: Build wheels
        run: |
          python -m pip install --quiet --upgrade pip wheel uv
          # The versions cgr's uv.lock pins, which upstream tests against. The
          # newest releases moved huggingface-hub and google-genai from httpx
          # to httpx2, which left the httpx cgr imports out of the bundle.
          # cgr-graph-rs is a path in the lock (rust/cgr_graph_rs); its abi3
          # wheel comes from PyPI as cgr's own dependency instead.
          (cd upstream && uv export --frozen --no-dev --no-emit-project --no-emit-package cgr-graph-rs \
            --no-hashes --format requirements-txt -o ../requirements.txt)
          python -m pip wheel --no-deps -w wheels upstream/grammars/tree-sitter-pli \
            upstream/grammars/tree-sitter-jcl upstream/grammars/tree-sitter-hlasm \
            upstream/grammars/tree-sitter-db2 ./upstream
          ls wheels

      - name: Assemble bundle
        run: |
          mkdir -p bundle/python
          curl -sSfL -o python.zip "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-embed-amd64.zip"
          unzip -q python.zip -d bundle/python
          # The embeddable Python only searches the paths its ._pth file lists
          # and runs no .pth file, so pywin32's (which mcp needs on Windows)
          # is spelled out here: its module folders, and its DLLs next to the
          # .pyd files that load them.
          printf 'python312.zip\r\n.\r\n..\\lib\r\n..\\lib\\win32\r\n..\\lib\\win32\\lib\r\n..\\lib\\Pythonwin\r\nimport site\r\n' > bundle/python/python312._pth
          python -m pip install --quiet --only-binary :all: --target bundle/lib -r requirements.txt wheels/*.whl
          cp bundle/lib/pywin32_system32/*.dll bundle/lib/win32/
          mkdir -p bundle/viz
          cp -r viz/build_graph_site.py viz/graph.template.html viz/vendor bundle/viz/
          printf '@echo off\r\n"%%~dp0python\\python.exe" -m codebase_rag.cli %%*\r\n' > bundle/cgr.cmd
          printf '@echo off\r\n"%%~dp0python\\python.exe" "%%~dp0viz\\build_graph_site.py" %%*\r\n' > bundle/graph-site.cmd
          du -sh bundle

      - name: Make smoke-test sources
        run: |
          mkdir -p sample
          printf 'main: proc options(main);\n  call helper;\n  fetch dynpgm;\nend main;\n' > sample/ABMAIN01
          printf 'helper: proc;\nend helper;\n' > sample/ABHELP01
          printf 'dynpgm: proc;\nend dynpgm;\n' > sample/ABDYNP01
          printf '//ABJOB01 JOB (ACCT)\n//S1 EXEC PGM=ABMAIN01\n' > sample/ABJOB001
          printf 'CUSTFMT  FMT\n         FMTEND\nCUSTO    MSG   TYPE=OUTPUT,SOR=(CUSTFMT)\n         MSGEND\n' > sample/ABFCUST1
          printf 'CREATE TABLE PROD.CUSTOMER (ID INTEGER);\n' > sample/ABTCUST1
          printf 'show: proc;\n  dcl m char(8) init('"'"'CUSTO   '"'"');\n  exec sql select id into :i from prod.customer;\nend show;\n' > sample/ABSHOW01

      # Runs the .cmd files through cmd.exe, as a user would.
      - name: Smoke test - index and graph page
        shell: cmd
        env:
          CGR_PLI_EXTENSIONLESS_MEMBERS: "true"
        run: |
          call bundle\cgr.cmd -q index --repo-path sample -o idx || exit /b 1
          call bundle\graph-site.cmd idx -o graph.html || exit /b 1

      - name: Smoke test - check the graph
        run: |
          python - <<'EOF'
          import json, re
          page = open("graph.html", encoding="utf-8").read()
          graph = json.loads(re.search(r'id="graph-data">(.*?)</script>', page, re.S).group(1))
          calls = sorted(tuple(e) for e in graph["edges"] if e[1] == "CALLS")
          print(calls)
          assert calls == [
              ("sample.ABFCUST1.CUSTO", "CALLS", "sample.ABFCUST1.CUSTFMT"),
              ("sample.ABJOB001.ABJOB01", "CALLS", "sample.ABMAIN01.MAIN"),
              ("sample.ABMAIN01.MAIN", "CALLS", "sample.ABDYNP01.DYNPGM"),
              ("sample.ABMAIN01.MAIN", "CALLS", "sample.ABHELP01.HELPER"),
              ("sample.ABSHOW01.SHOW", "CALLS", "sample.ABFCUST1.CUSTO"),
              ("sample.ABSHOW01.SHOW", "CALLS", "sample.ABTCUST1.CUSTOMER"),
          ], "calls missing: a grammar did not load from the bundle"
          EOF

      - name: Smoke test - MCP server answers
        timeout-minutes: 2
        shell: pwsh
        run: |
          $env:TARGET_REPO_PATH = "$PWD\sample"
          $reply = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' | & .\bundle\cgr.cmd mcp-server
          $reply
          if (-not ($reply -match '"serverInfo"')) { exit 1 }

      # Two packages: pli-graph.vsix for a cgr installed some other way, and
      # pli-graph-win32-x64.vsix, which carries the bundle and needs nothing else.
      - name: Build VS Code extension
        working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package
          node package-vsix.mjs --bundle ../bundle
          ls -l *.vsix

      # Opens the smoke-test sample in a real VS Code with the unpacked Windows
      # package and no settings, so the extension runs its own cgr as it would
      # on a work machine.
      - name: Smoke test - VS Code extension
        timeout-minutes: 10
        run: |
          7z x -bso0 -ovsix vscode/pli-graph-win32-x64.vsix
          node vscode/test/e2e/run.mjs sample vsix/extension

      - name: Zip
        run: 7z a -bso0 -tzip cgr-pli-windows-x64.zip ./bundle/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cgr-pli-windows-x64
          path: cgr-pli-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pli-graph-vsix
          path: |
            vscode/pli-graph-win32-x64.vsix
            vscode/pli-graph.vsix
          if-no-files-found: error
