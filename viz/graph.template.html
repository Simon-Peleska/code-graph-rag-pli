<style>
/* The controls are vscode-elements, which take VS Code's theme from its
   --vscode-* variables; the graph's own colors come from the same ones. */
body {
  --text: var(--vscode-foreground, #cccccc); --muted: var(--vscode-descriptionForeground, #9d9d9d);
  --bg: var(--vscode-editor-background, #1f1f1f); --panel: var(--vscode-sideBar-background, #181818);
  --line: var(--vscode-panel-border, #2b2b2b); --node: var(--vscode-editorWidget-background, #202020);
  --node-border: var(--vscode-editorWidget-border, #454545); --edge: var(--vscode-editorLineNumber-foreground, #6e7681);
  --accent: var(--vscode-textLink-foreground, #4daafc); --accent-soft: var(--vscode-list-hoverBackground, #2a2d2e);
  --group: var(--vscode-sideBar-background, #181818); --main: var(--vscode-charts-orange, #d18616);
  --imports: var(--vscode-charts-purple, #b180d7); --error: var(--vscode-errorForeground, #f85149);
}

  background: var(--bg); color: var(--text); padding: 0;
  font-family: var(--vscode-font-family, system-ui, sans-serif); --code-font: var(--vscode-editor-font-family, ui-monospace, monospace);
  --flow-true: var(--vscode-terminal-ansiGreen, var(--vscode-charts-green, #23d18b)); --flow-false: var(--vscode-terminal-ansiRed, var(--vscode-charts-red, #f14c4c)); font-size: var(--vscode-font-size, 13px); line-height: 1.4;
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh;
}

  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 1em; margin: 0; font-weight: 600; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); min-width: 0; flex-wrap: wrap; }

  background: var(--vscode-quickInput-background, #222222); color: var(--vscode-quickInput-foreground, inherit);
  border: 1px solid var(--vscode-widget-border, #313131); border-radius: 6px;

.results div.active {
  background: var(--vscode-quickInputList-focusBackground, var(--vscode-list-activeSelectionBackground, #04395e));
  color: var(--vscode-quickInputList-focusForeground, var(--vscode-list-activeSelectionForeground, #ffffff));
}

vscode-split-layout { border: 0; min-height: 0; height: 100%; --separator-border: var(--line); }

.icon:hover { background: var(--vscode-toolbar-hoverBackground, rgb(90 93 94 / .31)); }
.icon[aria-pressed=true] { background: var(--vscode-inputOption-activeBackground, rgb(0 127 212 / .4)); border-color: var(--vscode-inputOption-activeBorder, #007acc); }

body.flow-page { grid-template-rows: 1fr; }

.access-write { --mark: var(--main); } .access-arg { --mark: var(--accent); } .access-compare { --mark: var(--imports); }
.access-read { --mark: var(--muted); } .access-outcome { --mark: var(--flow-true); }

#flow .lane-odd { fill: var(--panel); }
#flow .lane-line { stroke: var(--line); }

#flow .arrow { fill: var(--edge); }
#flow .guard { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
#flow .act rect, #flow .diamond { fill: var(--node); stroke: var(--node-border); stroke-width: 1.3; }
#flow .act text { fill: var(--text); font-family: var(--code-font); white-space: pre; }
#flow .act, #flow .diamond { cursor: pointer; }

#flow .edge.false { stroke: var(--flow-false); } #flow .arrow.false, #flow .guard.false { fill: var(--flow-false); }

<script>/*__CYTOSCAPE__*/</script>
<script>
"use strict";

// ---- data -----------------------------------------------------------------
// The page asks VS Code for what each view draws; a big graph does not fit in
// a page. byId keeps every node seen, for labels and links.
const host = acquireVsCodeApi();
const flowPage = ["flow", "data", "model", "crud", "use", "dead", "input"].includes(new URLSearchParams(location.hash.slice(1)).get("v"));
const byId = new Map();
const remember = nodes => { for (const n of nodes) byId.set(n.id, n); return nodes; };
let asked = 0;
const waiting = new Map();
function ask(what, ...args) {
  const id = ++asked;
  return new Promise((resolve, reject) => {
    waiting.set(id, { resolve, reject });
    host.postMessage({ type: "ask", id, what, args });
  });
}
window.addEventListener("message", event => {
  const message = event.data;
  if (message?.type === "answer") {
    const asking = waiting.get(message.id);
    waiting.delete(message.id);
    if (message.error) asking?.reject(new Error(message.error));
    else asking?.resolve(message.result);
  }
  if (message?.type === "changed" && flowPage) { dataFlow = null; renderDiagram(); }
  else if (message?.type === "changed") document.getElementById("reload-tool").hidden = false;
  if (message?.type === "go") location.hash = message.hash;
  if (message?.type === "cursor") focusAt(message.path, message.line);
});

const isProc = n => n && (n.kind === "function" || n.kind === "method");
const isModule = n => n && (n.kind === "module" || n.kind === "external");
const push = (map, key, value) => (map.get(key) || map.set(key, []).get(key)).push(value);
// The edges of the view drawn now.
let callees = new Map(), callers = new Map(), parentOf = new Map(), includes = new Set();
function useGraph(graph) {
  remember(graph.nodes);
  callees = new Map(); callers = new Map(); parentOf = new Map(); includes = new Set();
  for (const [source, type, target] of graph.edges) {
    if (type === "CALLS" || type === "INCLUDES") { push(callees, source, target); push(callers, target, source); }
    if (type === "INCLUDES") includes.add(`${source}>${target}`);
    else if (type === "DEFINES") parentOf.set(target, source);
  }
}
const moduleOf = id => { const n = byId.get(id); return isModule(n) ? id : n?.path; };

const parentFolder = folder => folder.includes("/") ? folder.slice(0, folder.lastIndexOf("/")) : "";
const label = id => { const n = byId.get(id); return isModule(n) ? id : n?.name ?? id; };
const isMain = n => (n.mods || []).some(m => m.toUpperCase() === "MAIN");
const byLabel = (a, b) => label(a.id).localeCompare(label(b.id));

// ---- small DOM helper -----------------------------------------------------
// A tree item stops its clicks; its tree reports them as a (non-bubbling) select.
const pickSelected = event => event.detail[0]?.pick?.();
const ICONS = /*__ICONS__*/{};
function setIcon(node, icon) { node.innerHTML = ICONS[icon] || ""; return node; }
for (const node of document.querySelectorAll("[data-icon]")) setIcon(node, node.dataset.icon);
const iconButton = (icon, title, onclick) => setIcon(el("button", { class: "icon", title, onclick }), icon);
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  if (tag === "vscode-tree") node.addEventListener("vsc-tree-select", pickSelected);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "onclick" && tag === "vscode-tree-item") node.pick = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child);
  return node;
}

// A table of the rows' cells under the heads, without the columns that are
// empty in every row.
function table(heads, rows) {
  const empty = heads.map((_, c) => rows.every(tr => !tr.children[c].textContent));
  for (const tr of rows) [...tr.children].forEach((td, c) => empty[c] && td.remove());
  return el("table", {}, el("tr", {}, heads.filter((_, c) => !empty[c]).map(h => el("th", {}, h))), rows);
}

function showError(code, message, error) {
  console.error(`[${code}] ${message}`, error || "");
  const box = document.getElementById("error");
  box.textContent = `[${code}] ${message}`;
  box.hidden = false;
}

// ---- routing: the URL hash holds the whole view state ---------------------
function route() {
  const params = new URLSearchParams(location.hash.slice(1));
  return {
    view: params.get("v") || "overview",
    id: params.get("id"),
    depth: params.get("d") === "all" ? Infinity : Math.min(3, Math.max(1, Number(params.get("d")) || 2)),
    direction: ["down", "up"].includes(params.get("dir")) ? params.get("dir") : "both",
    isolated: params.get("all") === "1",
  };
}
function go(changes) {
  const state = { ...route(), ...changes };
  const params = new URLSearchParams();
  if (state.view !== "overview") params.set("v", state.view);
  if (state.id) params.set("id", state.id);
  if (state.view === "proc" && state.depth !== 2) params.set("d", state.depth === Infinity ? "all" : state.depth);
  if ((state.view === "proc" || state.view === "deps") && state.direction !== "both") params.set("dir", state.direction);
  if (state.isolated) params.set("all", "1");
  location.hash = params.toString();
}
const open = id => go({ view: isModule(byId.get(id)) ? "module" : "proc", id });
// The page's views are numbered steps in its history. The mouse's back
// button on the first one goes back to the editor before the page. Pressed in
// an editor, it makes VS Code show this page, and its release here went back
// in the page too: only a press that started on the page counts.
let step = 0;
history.replaceState({ step }, "");
window.addEventListener("hashchange", () => {
  if (history.state === null) history.replaceState({ step: step + 1 }, "");
  step = history.state.step;
});
let pressedHere = false;
window.addEventListener("mousedown", e => { if (e.button === 3 || e.button === 4) pressedHere = true; }, true);
window.addEventListener("mouseup", e => {
  if (e.button !== 3 && e.button !== 4) return;
  if (!pressedHere) e.preventDefault();
  else if (e.button === 3 && step === 0) {
    e.preventDefault();
    host.postMessage({ type: "back" });
  }
  pressedHere = false;
}, true);

// ---- cytoscape ------------------------------------------------------------
// Read from body, where the palette is taken from VS Code's theme.
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
// Edges are S-curves that leave and enter their nodes vertically: the
// control points sit level with the middle, above each end. Cytoscape takes
// them as a weight along the straight line and a distance away from it.
function sCurve(edge) {
  const s = edge.source().position(), t = edge.target().position();
  const dx = t.x - s.x, dy = t.y - s.y, length2 = dx * dx + dy * dy;
  if (length2 < 1) return { weights: [0.5], distances: [0] };
  const length = Math.sqrt(length2), bend = dx * dy / 2 / length;
  return { weights: [dy * dy / 2 / length2, (dx * dx + dy * dy / 2) / length2], distances: [bend, -bend] };
}
function cyStyle() {
  return [
    { selector: "node", style: {
      label: "data(label)", "font-size": 11, color: css("--text"), "text-valign": "center", "text-halign": "center",
      "text-wrap": "wrap", "background-color": css("--node"), "border-width": 1, "border-color": css("--node-border"),
      shape: "round-rectangle", width: "data(w)", height: "data(h)",
      "transition-property": "opacity, background-color, border-color", "transition-duration": 150 } },
    { selector: "node.module", style: { "font-weight": 600 } },
    { selector: "node.folder", style: { "font-weight": 600, "background-color": css("--group"), "border-width": 2 } },
    { selector: "node.external", style: { "border-style": "dashed", color: css("--muted") } },
    { selector: "node.main", style: { "border-color": css("--main"), "border-width": 2 } },
    { selector: "node.other", style: { color: css("--muted"), "border-style": "dashed" } },
    { selector: "node.more", style: { "border-width": 0, "background-opacity": 0, color: css("--muted") } },
    { selector: "node.focus", style: { "background-color": css("--accent-soft"), "border-color": css("--accent"), "border-width": 2 } },
    { selector: ":parent", style: {
      "background-color": css("--group"), "border-color": css("--line"), "text-valign": "top", "text-halign": "center",
      "font-size": 12, "font-weight": 600, color: css("--muted"), padding: 14, shape: "round-rectangle" } },
    { selector: ":parent.other", style: { "border-style": "dashed" } },
    { selector: "node.hover", style: { "background-color": css("--accent-soft"), "border-color": css("--accent") } },
    { selector: "node:selected", style: { "border-color": css("--accent"), "border-width": 3 } },
    { selector: "edge", style: {
      width: "data(width)", "line-color": css("--edge"), "target-arrow-color": css("--edge"),
      "target-arrow-shape": "triangle", "arrow-scale": 0.9, "curve-style": "unbundled-bezier",
      "control-point-weights": edge => sCurve(edge).weights, "control-point-distances": edge => sCurve(edge).distances,
      "transition-property": "opacity, line-color, target-arrow-color", "transition-duration": 150 } },
    { selector: "edge:loop", style: { "curve-style": "bezier" } },
    { selector: "edge.imports", style: { "line-style": "dashed", "line-color": css("--imports"), "target-arrow-color": css("--imports") } },

const cy = cytoscape({
  container: document.getElementById("cy"), style: cyStyle(), wheelSensitivity: 0.3,
  minZoom: 0.05, maxZoom: 3, boxSelectionEnabled: false,
});
// The panes get their sizes after the first draw, and the sashes move.
// Resizing clears the canvas and Cytoscape redraws only on a later frame,
// so it draws here, before the browser paints the blank canvas.
new ResizeObserver(() => { cy.resize(); fit(); cy.renderer().render(); }).observe(document.getElementById("cy"));
cytoscape.use(cytoscapeFcose);
// VS Code switches themes by changing the body's class.
new MutationObserver(() => cy.style(cyStyle())).observe(document.body, { attributes: true, attributeFilter: ["class"] });

// The width nodeData gives the widest of these nodes.
const widest = (ids, withModule = false) => Math.max(44, ...ids.map(id =>
  Math.max(label(id).length, withModule && isProc(byId.get(id)) ? (moduleOf(id) || "").length : 0) * 7 + 18));

function nodeData(id, extra = {}) {
  const n = byId.get(id);
  const text = extra.label || (isProc(n) && extra.withModule ? `${n.name}\n${moduleOf(id) || ""}` : label(id));
  const lines = text.split("\n");
  return {
    data: { id, label: text, w: Math.max(44, Math.max(...lines.map(l => l.length)) * 7 + 18), h: 14 * lines.length + 14, ...extra.data },
    classes: [n ? n.kind : "", n && isMain(n) ? "main" : "", ...(extra.classes || [])].join(" "),
    position: extra.position,
  };
}
const edgeData = (source, target, kind, weight = 1) => ({
  data: { id: `${kind}:${source}->${target}`, source, target, width: Math.min(6, 1 + Math.log2(weight)) },
  classes: kind,
});

const nodeRef = node => node.data("ref") || node.id();
cy.on("tap", "node", event => { const id = nodeRef(event.target); if (byId.has(id)) showDetails(id); });
cy.on("dbltap", "node", event => {
  const id = nodeRef(event.target);
  if (id.startsWith("dir:")) go({ view: "overview", id: id.slice(4) || null });
  else if (route().view === "deps" && isModule(byId.get(id))) go({ id });
  else if (byId.has(id)) open(id);
});
cy.on("tap", event => { if (event.target === cy) showDetails(route().id); });
cy.on("mouseover", "node", event => {
  const node = event.target;
  if (node.isParent()) return;
  node.addClass("hover");
  cy.elements().addClass("faded");
  const near = node.closedNeighborhood();
  near.union(near.ancestors()).removeClass("faded");
});
cy.on("mouseout", "node", () => cy.elements().removeClass("faded hover"));

// ---- views ----------------------------------------------------------------
// One folder: its subfolders and its own modules, with the calls and includes
// between them summed up. Past 300 items VS Code sends only the most
// connected: a force layout of 20,000 modules never finishes, and could not
// be read if it did. Search and the module list reach the rest.
function overview(state, data) {
  const inside = state.id ? `${state.id}/` : "";
  remember(data.modules);
  const elements = [
    ...data.folders.map(f => nodeData(f.id, { label: `${f.id.slice(4 + inside.length)}/\n${f.modules} modules`, classes: ["folder"] })),
    ...data.modules.map(n => nodeData(n.id)),
    ...data.edges.map(([a, b, kind, weight]) => edgeData(a, b, kind, weight)),
  ];
  const notes = [];
  if (data.modules.length < data.connected) notes.push(`${data.connected - data.modules.length} not drawn`);
  if (data.unlinked) notes.push(`${data.unlinked} unlinked hidden`);
  return {
    elements,
    // fcose: force-directed, edges act as springs, so linked modules end up close together.
    layout: { name: "fcose", animate: false, randomize: true, quality: elements.length > 1500 ? "draft" : "default",
              nodeRepulsion: () => 400000, idealEdgeLength: () => 220, edgeElasticity: () => 0.3, nodeDimensionsIncludeLabels: true,
              nodeSeparation: 140, gravity: 0.15, numIter: 3000, packComponents: true },
    status: notes.join(" · "),
  };
}

function moduleView(state, graph) {
  useGraph(graph);
  const moduleId = state.id;
  const own = graph.nodes.filter(n => isProc(n) && n.path === moduleId).map(n => n.id);
  const ownSet = new Set(own);
  const side = new Map();  // procedure outside the module -> layer: -1 callers above, 1 callees below
  for (const id of own) for (const target of callees.get(id) || []) if (!ownSet.has(target)) side.set(target, 1);
  for (const id of own) for (const source of callers.get(id) || []) if (!ownSet.has(source) && !side.has(source)) side.set(source, -1);
  // The module calling its own procedures from the top level is drawn once, in the middle.
  side.delete(moduleId);

  const LAYER_GAP = 170, STEP = widest([...own, ...side.keys()]) + 24, GROUP_GAP = 60, SIDE_LIMIT = 60;
  const elements = [];
  const x = new Map();
  const add = (id, parent, layer) => elements.push(nodeData(id, {
    classes: parent === moduleId ? [] : ["other"], data: parent ? { parent } : {},
    position: { x: x.get(id), y: layer * LAYER_GAP },
  }));

  // Middle layer: the module's own procedures in source order.
  own.sort((a, b) => (byId.get(a).line || 0) - (byId.get(b).line || 0));
  own.forEach((id, i) => x.set(id, (i - (own.length - 1) / 2) * STEP));
  elements.push(nodeData(moduleId, { classes: ["focus"], position: { x: 0, y: 0 } }));
  for (const id of own) add(id, moduleId, 0);

  // Outer layers: each outside procedure wants to sit straight above or below
  // the average of the procedures it connects to (barycenter), modules ordered
  // by their members' average; then push right just enough to avoid overlaps.
  const placeSide = layer => {
    let ids = [...side].filter(([, l]) => l === layer).map(([id]) => id);
    // A widely used module has thousands of callers; draw the most connected.
    const more = Math.max(0, ids.length - SIDE_LIMIT);
    if (more) {
      const links = new Map(ids.map(id => [id, [...(callees.get(id) || []), ...(callers.get(id) || [])].filter(n => ownSet.has(n)).length]));
      ids.sort((a, b) => links.get(b) - links.get(a));
      for (const id of ids.slice(SIDE_LIMIT)) side.delete(id);
      ids = ids.slice(0, SIDE_LIMIT);
    }
    const want = new Map(ids.map(id => {
      const xs = [...(callees.get(id) || []), ...(callers.get(id) || [])].filter(n => ownSet.has(n)).map(n => x.get(n));
      return [id, xs.reduce((a, b) => a + b, 0) / xs.length];
    }));
    const groups = new Map();
    for (const id of ids) push(groups, moduleOf(id) || "", id);
    const mean = list => list.reduce((a, id) => a + want.get(id), 0) / list.length;
    const order = [...groups.keys()].sort((a, b) => mean(groups.get(a)) - mean(groups.get(b)));
    let cursor = -Infinity, drift = 0;
    for (const group of order) {
      const members = groups.get(group).sort((a, b) => want.get(a) - want.get(b));
      const left = Math.max(cursor, mean(members) - (members.length - 1) / 2 * STEP);
      members.forEach((id, i) => { x.set(id, left + i * STEP); drift += want.get(id) - x.get(id); });
      cursor = left + members.length * STEP + GROUP_GAP;
    }
    // Overlap pushes layers right; shift back so they stay centred on their targets.
    for (const id of ids) x.set(id, x.get(id) + drift / Math.max(1, ids.length));
    // A module can show up in both outer layers, so each layer gets its own box.
    for (const group of order) {
      const box = group && `${group} @${layer}`;
      if (box) elements.push(nodeData(box, { label: group, classes: ["module", "other"], data: { ref: group } }));
      for (const id of groups.get(group)) add(id, box, layer);
    }
    if (more) elements.push({
      data: { id: `more:${layer}`, label: `… ${more} more`, w: 120, h: 28 }, classes: "more",
      position: { x: Math.max(...ids.map(id => x.get(id))) + STEP + GROUP_GAP, y: layer * LAYER_GAP },
    });
    hiddenCount += more;
  };
  let hiddenCount = 0;
  placeSide(-1);
  placeSide(1);

  for (const id of own) {
    for (const target of new Set(callees.get(id) || [])) {
      if (!ownSet.has(target) && !side.has(target)) continue;
      const edge = edgeData(id, target, "calls");
      if (ownSet.has(target)) edge.classes += " inner";
      elements.push(edge);
    }
    for (const source of new Set(callers.get(id) || [])) if (!ownSet.has(source) && side.has(source)) elements.push(edgeData(source, id, "calls"));
    const parent = parentOf.get(id);
    if (ownSet.has(parent)) elements.push(edgeData(parent, id, "defines inner"));
  }
  return {
    elements,
    layout: { name: "preset", fit: true, padding: 40 },
    status: hiddenCount ? `${hiddenCount} not drawn` : "",
  };
}

// Barycenter ordering, the core step of a layered (Sugiyama) layout: sort each
// layer by the average place of its neighbours in the other layers, so edges
// run as straight as possible. A few sweeps outward and back let it settle.
function orderColumns(columns, neighbours) {
  const columnOf = new Map(), row = new Map();
  for (const [column, ids] of columns) for (const id of ids) columnOf.set(id, column);
  const place = ids => ids.forEach((id, i) => row.set(id, i - (ids.length - 1) / 2));
  for (const ids of columns.values()) place(ids);
  const outward = [...columns.keys()].filter(c => c !== 0).sort((a, b) => Math.abs(a) - Math.abs(b));
  for (let sweep = 0; sweep < 6; sweep++) {
    for (const column of sweep % 2 ? [...outward].reverse() : outward) {
      const ids = columns.get(column);
      const score = new Map(ids.map(id => {
        const rows = neighbours(id).filter(n => columnOf.has(n) && columnOf.get(n) !== column).map(n => row.get(n));
        return [id, rows.length ? rows.reduce((a, b) => a + b) / rows.length : row.get(id)];
      }));
      ids.sort((a, b) => score.get(a) - score.get(b));
      place(ids);
    }
  }
}

// VS Code sends the procedures `depth` calls away, or the modules a module
// uses or is used by; this walks them again to put each on the level it is
// reached at first, what it uses below, what uses it above.
function procView(state, graph) {
  useGraph(graph);
  const focus = state.id;
  const level = new Map([[focus, 0]]);
  const walk = (neighbours, sign) => {
    const seen = new Set([focus]);
    let frontier = [focus];
    for (let depth = 1; depth <= state.depth && frontier.length; depth++) {
      const next = [];
      for (const id of frontier) for (const other of neighbours.get(id) || []) {
        if (seen.has(other)) continue;
        seen.add(other);
        next.push(other);
        if (!level.has(other)) level.set(other, sign * depth);
      }
      frontier = next;
    }
  };
  if (state.direction !== "up") walk(callees, 1);
  if (state.direction !== "down") walk(callers, -1);

  const columns = new Map();
  for (const [id, column] of level) push(columns, column, id);
  const elements = [];
  const PER_COLUMN = 60, LAYER_GAP = 150, STEP = widest([...level.keys()], true) + 24;
  for (const ids of columns.values()) ids.sort((a, b) => label(a).localeCompare(label(b)));
  orderColumns(columns, id => [...(callees.get(id) || []), ...(callers.get(id) || [])]);
  // Rows fill outward from the focus, and a node is drawn only when the one
  // it was reached from is: otherwise a full row leaves it hanging unconnected.
  const drawn = new Set([focus]);
  for (const column of [...columns.keys()].sort((a, b) => Math.abs(a) - Math.abs(b))) {
    const ids = columns.get(column);
    const from = column > 0 ? callers : callees;
    const shown = column === 0 ? ids : ids.filter(id => (from.get(id) || []).some(n => drawn.has(n) && level.get(n) === column - Math.sign(column))).slice(0, PER_COLUMN);
    for (const id of shown) drawn.add(id);
    const more = ids.length - shown.length;
    const rows = shown.length + (more ? 1 : 0);
    shown.forEach((id, row) => elements.push(nodeData(id, {
      withModule: true, classes: id === focus ? ["focus"] : [],
      position: { x: (row - (rows - 1) / 2) * STEP, y: column * LAYER_GAP },
    })));
    if (more) elements.push({
      data: { id: `more:${column}`, label: `… ${more} more`, w: 120, h: 28 }, classes: "more",
      position: { x: (rows - 1 - (rows - 1) / 2) * STEP, y: column * LAYER_GAP },
    });
  }
  const shownIds = new Set(elements.map(e => e.data.id));
  for (const id of shownIds) for (const target of callees.get(id) || []) {
    if (shownIds.has(target)) elements.push(edgeData(id, target, includes.has(`${id}>${target}`) ? "imports" : "calls"));
  }
  return {
    elements,
    layout: { name: "preset", fit: true, padding: 40 },
    status: "",
  };
}

// ---- details panel --------------------------------------------------------
const LIST_LIMIT = 200;
function section(title, count, ...content) {
  return el("vscode-collapsible", { heading: title, open: "" },
    el("vscode-badge", { slot: "decorations", variant: "counter" }, String(count)), ...content);
}
function linkList(title, nodes, home) {
  const unique = [...new Map(remember(nodes).map(n => [n.id, n])).values()].sort(byLabel);
  if (!unique.length) return [];
  return [section(title, unique.length,
    el("vscode-tree", null, unique.slice(0, LIST_LIMIT).map(n => el("vscode-tree-item", { onclick: () => open(n.id), title: n.id }, label(n.id),
      isProc(n) && n.path !== home ? el("span", { slot: "description" }, n.path || "") : null))),
    unique.length > LIST_LIMIT ? el("div", { class: "empty" }, `… ${unique.length - LIST_LIMIT} more`) : null)];
}

let detailsAsked = 0;
async function showDetails(id) {
  const mine = ++detailsAsked;
  const panel = document.getElementById("details");
  const n = byId.get(id);
  let details = null;
  try {
    details = n ? await ask("details", id) : null;
    if (mine !== detailsAsked) return;
    if (!n) {
      const sum = await ask("summary");
      if (mine !== detailsAsked) return;
      panel.replaceChildren(el("div", { class: "head" }, el("h2", null, sum.project),
        el("p", { class: "sub" }, `${sum.modules} modules · ${sum.procedures} procedures · ${sum.unresolved} unresolved`)));
      return;
    }
  } catch (error) {
    if (mine === detailsAsked) showError("VIZ-103", `could not read the details of ${id}: ${error.message}`, error);
    return;
  }
  panel.replaceChildren();
  const where = n.path ? `${n.path}${n.line ? `:${n.line}–${n.end}` : ""}` : "";
  panel.append(el("div", { class: "head" },
    n.mods?.length ? el("div", null, ...n.mods.map(m => el("vscode-badge", { variant: m.toUpperCase() === "MAIN" ? "activity-bar-counter" : "default" }, m))) : null,
    el("div", { class: "title" }, el("h2", null, label(id)),
      el("div", { class: "actions" }, n.path ? iconButton("go-to-file", "Source", () => host.postMessage({ type: "open", path: n.path, line: n.line || 1 })) : null)),
    where && where !== label(id) ? el("div", { class: "sub" }, where) : null));
  const head = panel.querySelector(".actions");
  // An include the repository lacks has nothing more to show.
  if (!details) return;
  if (isModule(n)) {
    panel.append(...linkList("Procedures", details.procedures, id),
      ...linkList("Includes", details.includes),
      ...linkList("Included by", details.includedBy),
      ...linkList("Calls into", details.callsInto),
      ...linkList("Called from", details.calledFrom),
      details.unresolved.length ? section("Unresolved", details.unresolved.length, el("div", { class: "sub text" }, details.unresolved.join(", "))) : []);
    if (route().id !== id || route().view !== "module") head.append(iconButton("type-hierarchy", "Graph", () => open(id)));
    if (route().id !== id || route().view !== "deps") head.append(iconButton("references", "Dependencies", () => go({ view: "deps", id })));
    // The flow of the module's main procedure, else of its first.
    const main = details.procedures.find(isMain) || [...details.procedures].sort((a, b) => a.line - b.line)[0];
    if (main) head.append(iconButton("git-merge", "Flow", () => host.postMessage({ type: "flow", procedure: main.id })));
  } else {
    panel.append(...linkList("Defined in", details.definedIn),
      ...linkList("Called by", details.calledBy),
      ...linkList("Calls", details.calls));
    panel.append(...linkList("Defines", details.defines, n.path));
    if (route().id !== id || route().view !== "proc") head.append(iconButton("type-hierarchy", "Graph", () => open(id)));
    head.append(iconButton("git-merge", "Flow", () => host.postMessage({ type: "flow", procedure: id })));
  }
}

// ---- header + sidebar -----------------------------------------------------
function folderCrumbs(folder) {
  const parts = [el("a", { onclick: () => go({ view: "overview", id: null }) }, "Modules")];
  let path = "";
  for (const name of folder ? folder.split("/") : []) {
    path = path ? `${path}/${name}` : name;
    const target = path;
    parts.push("›", el("a", { onclick: () => go({ view: "overview", id: target }) }, name));
  }
  return parts;
}
function renderCrumbs(state) {
  const crumbs = document.getElementById("crumbs");
  const here = text => el("span", { class: "here" }, text);
  if (state.view === "overview") {
    const parts = folderCrumbs(state.id || "");
    return crumbs.replaceChildren(...parts.slice(0, -1), here(parts.at(-1).textContent));
  }
  const moduleId = moduleOf(state.id) || "";
  const parts = [...folderCrumbs(parentFolder(moduleId)), "›"];
  if (state.view === "module") parts.push(here(moduleId));
  else if (state.view === "deps") parts.push(el("a", { onclick: () => go({ view: "module", id: moduleId }) }, moduleId), "›", here("dependencies"));
  else parts.push(el("a", { onclick: () => go({ view: "module", id: moduleId }) }, moduleId), "›", here(label(state.id)));
  crumbs.replaceChildren(...parts);
}

let tab = "modules";
let listAsked = 0;
async function renderList() {
  const mine = ++listAsked;
  const list = document.getElementById("list");
  let found;
  try {
    found = await ask("list", tab, document.getElementById("filter").value);
  } catch (error) {
    if (mine === listAsked) showError("VIZ-104", `could not list the ${tab}: ${error.message}`, error);
    return;
  }
  if (mine !== listAsked) return;
  // Modules and unresolved names open a module, the entry points a procedure.
  const view = tab === "entries" ? "proc" : "module";
  list.replaceChildren(...found.rows.map(r => el("vscode-tree-item", { title: r.title || r.id, onclick: () => go({ view, id: r.id }) },
    r.text, r.sub ? el("span", { slot: "description" }, r.sub) : null, el("span", { slot: "decoration", class: "n" }, String(r.count)))));
  document.querySelectorAll("#list ~ .empty").forEach(note => note.remove());
  if (found.total > found.rows.length) list.after(el("div", { class: "empty" }, `${found.total - found.rows.length} more, refine the filter`));
  if (!found.total) list.after(el("div", { class: "empty" }, "nothing here"));
}
// The tabs share one filter and list, which move into the selected panel.
document.getElementById("tabs").addEventListener("vsc-tabs-select", event => {
  const index = event.detail.selectedIndex;
  tab = ["modules", "entries", "unresolved"][index];
  document.querySelectorAll("#tabs vscode-tab-panel")[index].append(document.getElementById("list-pane"));
  renderList();
});
document.getElementById("filter").addEventListener("input", renderList);
document.getElementById("list").addEventListener("vsc-tree-select", pickSelected);

// ---- search ---------------------------------------------------------------
const search = document.getElementById("search"), results = document.getElementById("results");
let hits = [], active = 0, searchAsked = 0;
async function renderResults() {
  const mine = ++searchAsked;
  const query = search.value.trim();
  let found = [];
  try {
    found = query ? await ask("search", query) : [];
    if (flowPage) found = found.filter(isProc);
  } catch (error) {
    if (mine === searchAsked) showError("VIZ-105", `could not search for ${query}: ${error.message}`, error);
    return;
  }
  if (mine !== searchAsked) return;
  hits = remember(found);
  active = 0;
  results.hidden = !query;
  results.replaceChildren(...[...hits.map((hit, i) => el("div", { "data-i": i, class: i === active ? "active" : "", onclick: () => pick(i) },
    label(hit.id), el("div", { class: "sub" }, `${hit.kind} · ${hit.path || ""}`))),

// ---- data model -----------------------------------------------------------
// A DDL file's tables, views and aliases as a UML class diagram: a box per
// table with its columns, a foreign key a solid arrow to the table it
// references, a view's FROM and an alias's FOR a dashed one. Referenced
// tables sit in the rows above the ones that reference them.
const MODEL = { gapX: 56, gapY: 80, line: 17, pad: 10, head: 38, columns: 40, size: 12 };
function textWidth(text, code) {
  flowCanvas ??= document.createElement("canvas").getContext("2d");
  flowCanvas.font = `${code ? 400 : 600} ${MODEL.size}px ${getComputedStyle(document.body).getPropertyValue(code ? "--code-font" : "font-family")}`;
  return flowCanvas.measureText(text).width;
}
function layoutModel(model) {
  const boxes = new Map();
  for (const e of model.entities) {
    const rows = e.columns.slice(0, MODEL.columns).map(c => ({
      mark: [c.key ? "PK" : "", c.foreign ? "FK" : ""].filter(Boolean).join(","), name: c.name, type: `${c.type}${c.notNull ? "" : " [0..1]"}`,
    }));
    if (e.columns.length > MODEL.columns) rows.push({ mark: "", name: `… ${e.columns.length - MODEL.columns} more`, type: "" });
    const markW = Math.max(0, ...rows.map(r => textWidth(r.mark, true))) + (rows.some(r => r.mark) ? 8 : 0);
    const nameW = Math.max(0, ...rows.map(r => textWidth(r.name, true)));
    const typeW = Math.max(0, ...rows.map(r => textWidth(r.type, true)));
    const title = e.qualifier ? `${e.qualifier}.${e.name}` : e.name;
    const w = Math.ceil(Math.max(140, textWidth(title) + 2 * MODEL.pad, markW + nameW + 12 + typeW + 2 * MODEL.pad));
    const h = MODEL.head + (rows.length ? rows.length * MODEL.line + MODEL.pad : 0);
    boxes.set(e.id, { e, title, rows, markW, nameW, w, h, layer: null, x: 0, y: 0 });
  }
  const targets = new Map();
  for (const r of model.relations) if (r.from !== r.to) push(targets, r.from, r.to);
  // A cycle of foreign keys stops where it started.
  const layerOf = (id, seen) => {
    const box = boxes.get(id);
    if (box.layer !== null) return box.layer;
    if (seen.has(id)) return 0;
    seen.add(id);
    const layer = Math.max(-1, ...(targets.get(id) ?? []).map(t => layerOf(t, seen))) + 1;
    seen.delete(id);
    return box.layer = layer;
  };
  for (const id of boxes.keys()) layerOf(id, new Set());

  // Each layer in order of the boxes above it that it points to, wrapped into rows.
  const wide = Math.max(900, document.getElementById("flow-body").clientWidth - 40);
  const layers = [];
  for (const box of boxes.values()) (layers[box.layer] ??= []).push(box);
  const span = Math.max(...layers.filter(Boolean).map(layer => Math.min(wide, layer.reduce((sum, box) => sum + box.w + MODEL.gapX, 40 - MODEL.gapX))));
  const rows = [];
  let y = 20;
  for (const layer of layers.filter(Boolean)) {
    const above = box => { const xs = (targets.get(box.e.id) ?? []).map(t => boxes.get(t)).filter(t => t.layer < box.layer).map(t => t.x + t.w / 2); return xs.length ? xs.reduce((a, b) => a + b) / xs.length : Infinity; };
    layer.sort((a, b) => above(a) - above(b) || a.e.distance - b.e.distance || a.title.localeCompare(b.title));
    let row = [];
    // A row moves under the boxes it points to, as far as the left edge allows; one pointing nowhere is centered.
    const place = () => {
      if (!row.length) return;
      let x = 20;
      for (const box of row) { box.x = x; box.y = y; x += box.w + MODEL.gapX; }
      const pulled = row.filter(box => above(box) !== Infinity);
      const shift = pulled.length ? pulled.reduce((sum, box) => sum + above(box) - box.x - box.w / 2, 0) / pulled.length : (span - x + MODEL.gapX - 20) / 2;
      for (const box of row) box.x += Math.max(0, shift);
      rows.push(row);
      y += Math.max(...row.map(b => b.h)) + MODEL.gapY;
      row = [];
    };
    for (const box of layer) {
      if (row.length && row.reduce((sum, b) => sum + b.w + MODEL.gapX, box.w + 20) > wide) place();
      row.push(box);
    }
    place();
  }
  const width = Math.max(...rows.flat().map(box => box.x + box.w)) + 20;

  // Where an edge meets a box: spread along the side it leaves or enters by, in the order of the other ends.
  const edges = model.relations.map(r => ({ r, a: boxes.get(r.from), b: boxes.get(r.to) })).filter(e => e.a && e.b);
  const ends = new Map();
  for (const e of edges) {
    if (e.a === e.b) continue;
    const down = e.b.y > e.a.y + e.a.h, up = e.b.y + e.b.h < e.a.y;
    e.sides = up ? ["top", "bottom"] : down ? ["bottom", "top"] : e.b.x > e.a.x ? ["right", "left"] : ["left", "right"];
    push(ends, `${e.r.from} ${e.sides[0]}`, { e, at: 0, other: e.b });
    push(ends, `${e.r.to} ${e.sides[1]}`, { e, at: 1, other: e.a });
  }
  for (const [key, list] of ends) {
    const side = key.slice(key.lastIndexOf(" ") + 1), box = list[0].at ? list[0].e.b : list[0].e.a;
    const across = side === "top" || side === "bottom";
    list.sort((p, q) => across ? p.other.x - q.other.x : p.other.y - q.other.y);
    list.forEach((p, i) => {
      const t = (i + 1) / (list.length + 1);
      p.e[p.at ? "end" : "start"] = across
        ? { x: box.x + box.w * t, y: side === "top" ? box.y : box.y + box.h, side }
        : { x: side === "left" ? box.x : box.x + box.w, y: box.y + Math.min(box.h, MODEL.head + 60) * t, side };
    });
  }
  return { boxes: [...boxes.values()], edges, width, height: y - MODEL.gapY + 20 };
}

function drawModel(model, layout, path) {
  targets = [];
  const { boxes, edges, width, height } = layout;
  const root = svg("svg", { width, height, viewBox: `0 0 ${width} ${height}` },
    svg("defs", null,
      svg("marker", { id: "model-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, svg("path", { d: "M0,0 L10,5 L0,10 z", class: "arrow" })),
      svg("marker", { id: "model-open", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, svg("path", { d: "M0,0 L10,5 L0,10", class: "open-arrow" }))));
  const bend = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] };
  for (const { r, a, start, end } of edges) {
    let d, label;
    if (r.from === r.to) {
      const x = a.x + a.w, y = a.y + 14;
      d = `M${x},${y} C${x + 50},${y - 10} ${x + 50},${y + 40} ${x},${y + 30}`;
      label = { x: x + 44, y: y + 14 };
    } else {
      const reach = Math.max(30, Math.min(120, Math.hypot(end.x - start.x, end.y - start.y) / 2.5));
      const [sx, sy] = bend[start.side], [ex, ey] = bend[end.side];
      d = `M${start.x},${start.y} C${start.x + sx * reach},${start.y + sy * reach} ${end.x + ex * reach},${end.y + ey * reach} ${end.x},${end.y}`;
      label = { x: (start.x + end.x) / 2 + (sx + ex) * reach * 0.375, y: (start.y + end.y) / 2 + (sy + ey) * reach * 0.375 };
    }
    const what = r.kind === "references" ? `foreign key (${r.columns.join(", ")})` : r.kind === "view" ? "the view reads it" : "an alias of it";
    root.append(svg("path", { d, class: `edge ${r.kind}`, "marker-end": r.kind === "references" ? "url(#model-arrow)" : "url(#model-open)" },
      titled(`${r.from.replace(/^.*:(.*):\d+$/, "$1")} → ${r.to.replace(/^.*:(.*):\d+$/, "$1")}: ${what}`)));
    const text = r.kind === "references" ? r.columns.join(", ") : `«${r.kind === "view" ? "from" : "for"}»`;
    if (text) root.append(svg("text", { x: label.x, y: label.y + 4, class: `guard ${r.kind}`, "text-anchor": "middle" }, text));
  }
  for (const box of boxes) {
    const { e } = box;
    const g = svg("g", { class: `entity ${e.kind}${e.path === path ? " own" : ""}` },
      svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 2 }),
      svg("text", { x: box.x + box.w / 2, y: box.y + 14, "text-anchor": "middle", class: "stereo" }, `«${e.kind}»`),
      svg("text", { x: box.x + box.w / 2, y: box.y + 30, "text-anchor": "middle", class: "name" }, box.title),
      titled(`${e.kind} ${box.title} · ${e.path}:${e.line}`));
    if (box.rows.length) g.append(svg("line", { x1: box.x, y1: box.y + MODEL.head, x2: box.x + box.w, y2: box.y + MODEL.head, class: "divider" }));
    box.rows.forEach((row, i) => {
      const y = box.y + MODEL.head + MODEL.pad / 2 + (i + 1) * MODEL.line - 4, x = box.x + MODEL.pad;
      g.append(svg("text", { x, y, class: "mark" }, row.mark),
        svg("text", { x: x + box.markW, y, class: "column" }, row.name),
        svg("text", { x: x + box.markW + box.nameW + 12, y, class: "type" }, row.type));
    });
    g.addEventListener("click", () => e.path === path ? host.postMessage({ type: "open", path: e.path, line: e.line }) : go({ view: "model", id: e.path }));

}

      const rows = items.map(item => {
        const tr = el("tr", { title: `${item.path}:${item.line}`, onclick: () => host.postMessage({ type: "open", path: item.path, line: item.line }) },
          el("td", {}, el("pre", {}, `${item.path}:${item.line}`)), ...cells(item).map(c => el("td", {}, c)));
        target(tr, item, 0, row++);
        return tr;
      });
      return el("section", {}, el("h3", {}, `${title} (${items.length})`), rows.length
        ? table(["Where", ...head], rows)
        : el("div", { class: "guard" }, empty));
    };
    const sections = [
      section("Conditions that never change", "no condition tests only constants", ["Condition", "Why", "Never runs"], dead.conditions,
        c => [el("pre", {}, `${c.kind.toUpperCase()} ${c.condition}`), `always ${c.always}: ${c.why}`, `${c.branch === "body" ? "the body" : `${c.branch.toUpperCase()}`}, lines ${c.from}-${c.to}`]),
      section("Procedures nothing reaches", "every procedure is reached", ["Procedure", "Callers"], dead.procedures,
        p => [el("pre", {}, p.name), p.callers.length ? `only from code that never runs, in ${p.callers.join(", ")}` : "never called"]),
      section("Variables nothing reads", "every variable is read", ["Variable", "In", "Use"], dead.variables,
        v => [el("pre", {}, v.name), v.procedure ?? "the file", v.written ? "written, never read" : "never used"]),
    ];
    document.getElementById("flow-body").replaceChildren(el("div", { class: "rules crud dead" }, sections));
    status.textContent = "";
    host.postMessage({ type: "route", hash: location.hash.slice(1), title: `Dead Code: ${deadPath ? deadPath.split("/").pop() : "all"}`, drawMs: Math.round(performance.now() - read), sinceLoadMs: Math.round(performance.now()) });
    console.info(`[graph] ${what}: ${dead.conditions.length} conditions, ${dead.procedures.length} procedures, ${dead.variables.length} variables, read in ${Math.round(read - started)} ms, drawn in ${Math.round(performance.now() - read)} ms`);
  } catch (cause) {
    fail("VIZ-126", `could not draw ${what}: ${cause.message}`, cause);
  }
}

// ---- screen input ---------------------------------------------------------
// A screen's input validation rules (v=input): for each field of its input
// messages, the variable of the program's I/O area it lands in, what that is
// checked against and what follows, such as the error message set.
let inputName = "";
function showInput(name) {
  inputName = name || "";
  document.getElementById("flow-title").textContent = "";
  document.getElementById("flow-depth-label").hidden = true;
  document.getElementById("data-as").hidden = true;
  document.getElementById("flow-body").replaceChildren();
  renderInput();
}
async function renderInput() {
  const mine = ++flowAsked;
  const status = document.getElementById("flow-status"), error = document.getElementById("flow-error");
  const fail = (code, message, cause) => {
    console.error(`[${code}] ${message}`, cause || "");
    error.textContent = `[${code}] ${message}`;
    error.hidden = false;
    status.textContent = "";
  };
  error.hidden = true;
  status.textContent = "reading…";
  const started = performance.now();
  const what = `the input rules of the screen ${inputName}`;
  let input;
  try {
    input = await ask("screenInput", inputName);
  } catch (cause) {
    if (mine === flowAsked) fail("VIZ-127", `could not read ${what}: ${cause.message}`, cause);
    return;
  }
  if (mine !== flowAsked) return;
  if (!input.messages.length) return fail("VIZ-128", `no input message is mapped through the format ${input.format}`);
  try {
    const read = performance.now();
    targets = [];
    const open = (where) => () => host.postMessage({ type: "open", path: where.path, line: where.line });
    const said = (o) => `${o.guards.length ? `when ${o.guards.join("; ")}: ` : ""}${o.text.replace(/\s+/g, " ")}`;
    let row = 0, rules = 0;
    const cell = (text, where, x, y, tag = "pre") => {
      const node = el(tag, { title: `${where.path}:${where.line}`, onclick: open(where) }, text);
      target(node, where, x, y);
      return node;
    };
    const outcomes = (list, x, y) => el("td", {}, list.map((o, i) => cell(said(o), o, x, y + i / 10)));
    const sections = input.messages.map(m => {
      const head = el("h3", { class: "in", title: `${m.path}:${m.line}`, onclick: open(m) },
        `${m.name}${m.code ? ` · transaction ${m.code}` : ""} · ${m.receives.length ? m.receives.map(r => `GU into ${r.area} in ${r.path.split("/").pop()}`).join(", ") : m.programs.length ? `${m.programs.join(", ")} receive it with no GU on the I/O PCB` : "no program is known to receive it"}`);
      target(head, m, 0, row++);
      const rows = m.fields.flatMap(f => {
        const name = f.name ? `${f.name}${f.label ? ` '${f.label}'` : ""}` : `'${f.literal ?? ""}'`;
        const where = { path: m.path, line: f.line };
        const lines = [];
        const fieldCell = (y) => el("td", {}, lines.length === 0 ? cell(name, where, 0, y) : "");
        if (!f.variables.length) {
          const y = row++;
          lines.push(el("tr", {}, el("td", {}, cell(name, where, 0, y)), el("td", { class: "guard" }, f.unmapped.length ? f.unmapped.map(u => `bytes ${u.start}-${u.end} of ${u.area}`).join(", ") : "-"), el("td", {}), el("td", {}), el("td", {})));
          return lines;
        }
        for (const v of f.variables) {
          const variable = `${v.qualified}${v.goes.length ? ` → ${v.goes.join(", ")}` : ""}`;
          const checks = v.rules.length ? v.rules : [null];
          checks.forEach((r, i) => {
            const y = row++;
            const fieldTd = fieldCell(y);
            const variableTd = el("td", {}, i === 0 ? cell(variable, v, 1, y) : "");
            if (!r) return lines.push(el("tr", {}, fieldTd, variableTd, el("td", { class: "guard" }, "checked nowhere"), el("td", {}), el("td", {})));
            rules++;
            const reached = r.when.length ? el("div", { class: "guard" }, `reached ${r.when.map(w => w.join(" › ")).join(" or ")}`) : "";
            lines.push(el("tr", {}, fieldTd, variableTd, el("td", {}, cell(`${r.condition}`, r, 2, y), reached), outcomes(r.then, 3, y), outcomes(r.else, 4, y)));
          });
        }
        return lines;
      });
      return el("section", {}, head, table(["Field", "Variable", "Check", "True", "False"], rows));
    });
    document.getElementById("flow-body").replaceChildren(el("div", { class: "rules crud" }, sections, input.truncated ? el("div", { class: "guard" }, "some rules were cut off") : ""));
    status.textContent = "";
    host.postMessage({ type: "route", hash: location.hash.slice(1), title: `Screen Input: ${input.format}`, drawMs: Math.round(performance.now() - read), sinceLoadMs: Math.round(performance.now()) });
    console.info(`[graph] ${what}: ${input.messages.length} messages, ${rules} rules, read in ${Math.round(read - started)} ms, drawn in ${Math.round(performance.now() - read)} ms`);
  } catch (cause) {
    fail("VIZ-129", `could not draw ${what}: ${cause.message}`, cause);
  }
}

// The diagram tab shows a procedure's flow, a variable's data flow, a DDL
// file's data model, what transactions or a procedure do to the data, the
// dead code, or a screen's input rules.
const isModel = () => route().view === "model";
const isCrud = () => ["crud", "use"].includes(route().view);
const isDead = () => route().view === "dead";
const isInput = () => route().view === "input";
const showDiagram = () => isModel() ? showModel(route().id) : route().view === "data" ? showData(route().id) : isCrud() ? showCrud(route().id) : isDead() ? showDead(route().id) : isInput() ? showInput(route().id) : showFlow(route().id);
const renderDiagram = () => isModel() ? renderModel() : route().view === "data" ? renderData() : isCrud() ? renderCrud() : isDead() ? renderDead() : isInput() ? renderInput() : renderFlow();
document.getElementById("flow-depth").addEventListener("input", renderDiagram);

// ---- render ---------------------------------------------------------------
const views = {
  overview: { draw: overview, read: state => ask("overview", state.id || "", state.isolated) },
  module: { draw: moduleView, read: state => ask("module", state.id) },
  proc: { draw: procView, read: state => ask("procedure", state.id, state.depth === Infinity ? 0 : state.depth, state.direction) },
  deps: { draw: (state, graph) => procView({ ...state, depth: Infinity }, graph), read: state => ask("dependencies", state.id, state.direction) },
};
let drawn = 0;
async function render() {
  const mine = ++drawn;
  const state = route();
  if (!views[state.view]) state.view = "overview";
  document.getElementById("error").hidden = true;
  document.getElementById("status").textContent = "reading…";
  const started = performance.now();
  try {
    let data = await views[state.view].read(state);
    if (mine !== drawn) return;
    if (data === null) {
      showError("VIZ-101", `"${state.id}" is not in this graph; showing all modules`);
      state.view = "overview";
      state.id = null;
      data = await views.overview.read(state);
      if (mine !== drawn) return;
    }
    const read = performance.now();
    const view = views[state.view].draw(state, data);
    cy.batch(() => { cy.elements().remove(); cy.add(view.elements); });
    cy.layout(view.layout).run();
    fit();
    document.getElementById("status").textContent = view.status;
    console.info(`[graph] ${state.view} ${state.id || ""}: ${view.elements.length} elements, read in ${Math.round(read - started)} ms, drawn in ${Math.round(performance.now() - read)} ms`);
  } catch (error) {
    if (mine !== drawn) return;
    document.getElementById("status").textContent = "";
    showError("VIZ-102", `could not draw the ${state.view} view: ${error.message}`, error);
  }
  document.getElementById("depth").hidden = state.view !== "proc";
  for (const b of document.querySelectorAll("#depth vscode-button")) b.secondary = (b.dataset.depth === "all" ? Infinity : Number(b.dataset.depth)) !== state.depth;
  document.getElementById("direction").hidden = state.view !== "proc" && state.view !== "deps";
  for (const b of document.querySelectorAll("#direction button")) b.setAttribute("aria-pressed", String(b.dataset.direction === state.direction));
  document.getElementById("save-tool").hidden = state.view !== "proc" && state.view !== "deps";
  document.getElementById("deps-tool").hidden = state.view !== "module" && state.view !== "deps";
  setIcon(document.getElementById("deps"), state.view === "deps" ? "type-hierarchy" : "references").title = state.view === "deps" ? "Procedures" : "Dependencies";
  document.getElementById("isolated-tool").hidden = state.view !== "overview";
  document.getElementById("isolated").setAttribute("aria-pressed", String(!!state.isolated));
  renderCrumbs(state);
  showDetails(state.id);
  if (state.id && cy.getElementById(state.id).nonempty()) cy.getElementById(state.id).select();
  host.postMessage({ type: "route", hash: location.hash.slice(1), drawMs: Math.round(performance.now() - started), sinceLoadMs: Math.round(performance.now()) });
}

// The split layouts measure the panel only once it is drawn.
requestAnimationFrame(() => {
  const width = document.body.clientWidth;
  const left = Math.round(Math.min(260, width * 0.25)), right = Math.round(Math.min(320, width * 0.3));
  document.getElementById("sides").handlePosition = `${left}px`;
  document.getElementById("details-side").handlePosition = `${width - left - right}px`;
});
// The flow tab is this page showing only the flow of the procedure in its hash.
if (flowPage) {
  document.body.classList.add("flow-page");
  document.getElementById("flow").hidden = false;
  document.querySelector(".flow-head").append(el("span", { class: "spacer" }), document.querySelector(".search"));
  search.placeholder = "Show the flow of procedure…  ( / )";
  window.addEventListener("hashchange", showDiagram);
  showDiagram();
} else {
  window.addEventListener("hashchange", render);
  renderList();
  render();
}
</script>
</body>
</html>
