<style>
/* The controls are vscode-elements, which take VS Code's theme from its
   --vscode-* variables; the graph's own colors come from the same ones. */
body {
  --text: var(--vscode-foreground, #cccccc); --muted: var(--vscode-descriptionForeground, #9d9d9d);
  --bg: var(--vscode-editor-background, #1f1f1f); --panel: var(--vscode-sideBar-background, #181818);
  --line: var(--vscode-panel-border, #2b2b2b); --node: var(--vscode-editorWidget-background, #202020);
  --node-border: var(--vscode-editorWidget-border, #454545); --edge: var(--vscode-editorLineNumber-foreground, #6e7681);
  --accent: var(--vscode-textLink-foreground, #4daafc); --accent-soft: var(--vscode-list-hoverBackground, #2a2d2e);
  --group: var(--vscode-sideBar-background, #181818); --main: var(--vscode-charts-orange, #d18616);
  --imports: var(--vscode-charts-purple, #b180d7); --error: var(--vscode-errorForeground, #f85149);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); padding: 0;
  font-family: var(--vscode-font-family, system-ui, sans-serif); --code-font: var(--vscode-editor-font-family, ui-monospace, monospace);
  --flow-true: var(--vscode-terminal-ansiGreen, var(--vscode-charts-green, #23d18b)); --flow-false: var(--vscode-terminal-ansiRed, var(--vscode-charts-red, #f14c4c)); font-size: var(--vscode-font-size, 13px); line-height: 1.4;
  display: grid; grid-template-rows: auto 1fr; height: 100vh;
}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 1em; margin: 0; font-weight: 600; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); min-width: 0; flex-wrap: wrap; }
.crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--vscode-textLink-activeForeground, var(--text)); text-decoration: underline; }
.crumbs a, .results div[data-i], vscode-tree-item::part(wrapper), vscode-button::part(base) {
  transition: color .15s, background-color .15s;
}
.crumbs .here { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
.spacer { flex: 1; }
.tools { display: flex; gap: 4px; align-items: center; }
.search { position: relative; width: min(340px, 100%); }
.search vscode-textfield { width: 100%; }
.results {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 10; margin-top: 2px; padding: 4px 0;
  background: var(--vscode-quickInput-background, #222222); color: var(--vscode-quickInput-foreground, inherit);
  border: 1px solid var(--vscode-widget-border, #313131); border-radius: 6px;
  max-height: 60vh; overflow: auto; box-shadow: 0 0 8px 2px var(--vscode-widget-shadow, rgb(0 0 0 / .36));
}
.results div[data-i] { padding: 2px 10px; cursor: pointer; }
.results div[data-i]:hover { background: var(--vscode-list-hoverBackground, #2a2d2e); }
.results div.active {
  background: var(--vscode-quickInputList-focusBackground, var(--vscode-list-activeSelectionBackground, #04395e));
  color: var(--vscode-quickInputList-focusForeground, var(--vscode-list-activeSelectionForeground, #ffffff));
}
.sub { color: var(--muted); font-size: .92em; }
vscode-split-layout { border: 0; min-height: 0; height: 100%; --separator-border: var(--line); }
aside { background: var(--panel); overflow: auto; height: 100%; }
.filter { padding: 6px 10px; }
.filter vscode-textfield { width: 100%; }
.list .n { color: var(--muted); font-variant-numeric: tabular-nums; }
#canvas-wrap { position: relative; height: 100%; }
#cy { position: absolute; inset: 0; }
#status { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: .92em; pointer-events: none; }
#error {
  position: absolute; left: 12px; right: 12px; top: 12px; padding: 8px 10px; border-radius: 2px;
  border: 1px solid var(--vscode-inputValidation-errorBorder, var(--error));
  background: var(--vscode-inputValidation-errorBackground, #5a1d1d); color: var(--text);
}
.legend { position: absolute; right: 12px; top: 10px; display: flex; gap: 12px; font-size: .92em; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 5px; vertical-align: middle; border-top: 2px solid var(--edge); }
.legend .imp::before { border-top: 2px dashed var(--imports); }
.legend .def::before { border-top: 2px dotted var(--edge); }
.legend .mainp::before { width: 10px; height: 10px; border: 2px solid var(--main); border-radius: 3px; }
.details .head { padding: 10px 14px 8px; }
.details .head vscode-badge { margin-right: 4px; }
.details h2 { font-size: 1.1em; margin: 6px 0 2px; overflow-wrap: anywhere; }
.details .qn { color: var(--muted); font-size: .92em; overflow-wrap: anywhere; }
.details .head vscode-button { margin-top: 10px; }
.details .text { padding: 2px 14px 6px 22px; overflow-wrap: anywhere; }
.details p { margin: 0 0 8px; }
.empty { color: var(--muted); padding: 2px 14px 6px 22px; }
body.flow-page { grid-template-rows: 1fr; }
body.flow-page > header, body.flow-page > #sides { display: none; }
#flow { display: flex; flex-direction: column; min-height: 0; }
.flow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.flow-head h2 { font-size: 1em; margin: 0; font-weight: 600; }
.flow-head label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.flow-head input[type=range] { width: 160px; accent-color: var(--accent); }
.flow-head output { color: var(--text); min-width: 2ch; font-variant-numeric: tabular-nums; }
#flow-error { margin: 8px 12px 0; padding: 8px 10px; border-radius: 2px; border: 1px solid var(--vscode-inputValidation-errorBorder, var(--error)); background: var(--vscode-inputValidation-errorBackground, #5a1d1d); }
#flow-body { flex: 1; overflow: auto; position: relative; }
.flow-lanes { position: sticky; top: 0; z-index: 1; height: 38px; background: var(--panel); border-bottom: 1px solid var(--line); }
.flow-lanes div { position: absolute; top: 0; height: 100%; padding: 3px 8px; border-left: 1px solid var(--line); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
.flow-lanes div:hover b { color: var(--accent); }
.flow-lanes .include b { color: var(--imports); }
.flow-lanes .sub { display: block; overflow: hidden; text-overflow: ellipsis; }
#flow svg { display: block; font-size: 12px; }
#flow .lane-odd { fill: var(--panel); }
#flow .lane-line { stroke: var(--line); }
#flow .edge { fill: none; stroke: var(--edge); stroke-width: 1.3; shape-rendering: crispEdges; }
#flow .arrow { fill: var(--edge); }
#flow .guard { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
#flow .act rect, #flow .diamond { fill: var(--node); stroke: var(--node-border); stroke-width: 1.3; }
#flow .act text { fill: var(--text); font-family: var(--code-font); white-space: pre; }
#flow .act, #flow .diamond { cursor: pointer; }
#flow .act:hover rect, #flow .diamond:hover { stroke: var(--accent); }
#flow .call rect { stroke: var(--accent); }
#flow .include rect { stroke: var(--imports); stroke-dasharray: 5 3; }
#flow .missing rect { stroke: var(--error); stroke-dasharray: 3 3; }
#flow .ends rect { stroke: var(--main); }
#flow .cond rect { stroke: var(--muted); }
#flow .edge.true { stroke: var(--flow-true); } #flow .arrow.true, #flow .guard.true { fill: var(--flow-true); }
#flow .edge.false { stroke: var(--flow-false); } #flow .arrow.false, #flow .guard.false { fill: var(--flow-false); }
#flow .dot { fill: var(--text); }
#flow .ring { fill: none; stroke: var(--text); stroke-width: 1.5; }
</style>
</head>
<body>
<header>
  <h1>__PROJECT__</h1>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="spacer"></div>
  <div class="tools" id="depth" hidden>
    <span class="sub">depth</span>
    <vscode-button secondary data-depth="1">1</vscode-button><vscode-button secondary data-depth="2">2</vscode-button><vscode-button secondary data-depth="3">3</vscode-button><vscode-button secondary data-depth="all">all</vscode-button>
  </div>
  <div class="tools" id="direction" hidden>
    <vscode-button secondary data-direction="down" title="What it uses">uses ↓</vscode-button><vscode-button secondary data-direction="up" title="What uses it">used by ↑</vscode-button><vscode-button secondary data-direction="both">both</vscode-button>

  </div>

  <div class="tools"><vscode-button secondary id="fit">Fit</vscode-button></div>
  <div class="search">

</header>
<vscode-split-layout id="sides" fixed-pane="start" min-start="120px" min-end="200px">
  <aside slot="start">
    <vscode-tabs id="tabs" panel>
      <vscode-tab-header slot="header">Modules</vscode-tab-header>
      <vscode-tab-panel><div id="list-pane"><div class="filter"><vscode-textfield id="filter" type="search" placeholder="Filter"></vscode-textfield></div><vscode-tree class="list" id="list"></vscode-tree></div></vscode-tab-panel>
      <vscode-tab-header slot="header">Entry points</vscode-tab-header>
      <vscode-tab-panel></vscode-tab-panel>
      <vscode-tab-header slot="header">Unresolved</vscode-tab-header>
      <vscode-tab-panel></vscode-tab-panel>
    </vscode-tabs>
  </aside>
  <vscode-split-layout id="details-side" slot="end" fixed-pane="end" min-start="100px" min-end="120px">
    <div id="canvas-wrap" slot="start">
      <div id="cy"></div>
      <div id="status"></div>
      <div class="legend"><span>calls</span><span class="imp">includes</span><span class="def">defines</span><span class="mainp">OPTIONS(MAIN)</span></div>

</vscode-split-layout>
<main id="flow" hidden>
  <div class="flow-head">
    <h2 id="flow-title"></h2>
    <label title="How many calls deep the flow follows into the procedures it calls; deeper calls are cut off">Calls deep
      <input type="range" id="flow-depth" min="0" max="10" value="1"><output id="flow-depth-value">1</output></label>
    <span class="sub" id="flow-status"></span>
  </div>
  <div id="flow-error" hidden></div>
  <div id="flow-body"></div>

<script>/*__CYTOSCAPE__*/</script>
<script>
"use strict";

// ---- data -----------------------------------------------------------------
// The page asks VS Code for what each view draws; a big graph does not fit in
// a page. byId keeps every node seen, for labels and links.
const host = acquireVsCodeApi();
const flowPage = new URLSearchParams(location.hash.slice(1)).get("v") === "flow";
const byId = new Map();
const remember = nodes => { for (const n of nodes) byId.set(n.id, n); return nodes; };
let asked = 0;
const waiting = new Map();
function ask(what, ...args) {
  const id = ++asked;
  return new Promise((resolve, reject) => {
    waiting.set(id, { resolve, reject });
    host.postMessage({ type: "ask", id, what, args });
  });
}
window.addEventListener("message", event => {
  const message = event.data;
  if (message?.type === "answer") {
    const asking = waiting.get(message.id);
    waiting.delete(message.id);
    if (message.error) asking?.reject(new Error(message.error));
    else asking?.resolve(message.result);
  }
  if (message?.type === "changed" && flowPage) renderFlow();
  else if (message?.type === "changed") document.getElementById("reload-tool").hidden = false;
  if (message?.type === "go") location.hash = message.hash;
});

const isProc = n => n && (n.kind === "function" || n.kind === "method");
const isModule = n => n && (n.kind === "module" || n.kind === "external");
const push = (map, key, value) => (map.get(key) || map.set(key, []).get(key)).push(value);
// The edges of the view drawn now.
let callees = new Map(), callers = new Map(), parentOf = new Map(), includes = new Set();
function useGraph(graph) {
  remember(graph.nodes);
  callees = new Map(); callers = new Map(); parentOf = new Map(); includes = new Set();
  for (const [source, type, target] of graph.edges) {
    if (type === "CALLS" || type === "INCLUDES") { push(callees, source, target); push(callers, target, source); }
    if (type === "INCLUDES") includes.add(`${source}>${target}`);
    else if (type === "DEFINES") parentOf.set(target, source);
  }
}
const moduleOf = id => { const n = byId.get(id); return isModule(n) ? id : n?.path; };

const parentFolder = folder => folder.includes("/") ? folder.slice(0, folder.lastIndexOf("/")) : "";
const label = id => { const n = byId.get(id); return isModule(n) ? id : n?.name ?? id; };
const isMain = n => (n.mods || []).some(m => m.toUpperCase() === "MAIN");
const byLabel = (a, b) => label(a.id).localeCompare(label(b.id));

// ---- small DOM helper -----------------------------------------------------
// A tree item stops its clicks; its tree reports them as a (non-bubbling) select.
const pickSelected = event => event.detail[0]?.pick?.();
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  if (tag === "vscode-tree") node.addEventListener("vsc-tree-select", pickSelected);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "onclick" && tag === "vscode-tree-item") node.pick = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child);
  return node;
}

function showError(code, message, error) {
  console.error(`[${code}] ${message}`, error || "");
  const box = document.getElementById("error");
  box.textContent = `[${code}] ${message}`;
  box.hidden = false;
}

// ---- routing: the URL hash holds the whole view state ---------------------
function route() {
  const params = new URLSearchParams(location.hash.slice(1));
  return {
    view: params.get("v") || "overview",
    id: params.get("id"),
    depth: params.get("d") === "all" ? Infinity : Math.min(3, Math.max(1, Number(params.get("d")) || 2)),
    direction: ["down", "up"].includes(params.get("dir")) ? params.get("dir") : "both",
    isolated: params.get("all") === "1",
  };
}
function go(changes) {
  const state = { ...route(), ...changes };
  const params = new URLSearchParams();
  if (state.view !== "overview") params.set("v", state.view);
  if (state.id) params.set("id", state.id);
  if (state.view === "proc" && state.depth !== 2) params.set("d", state.depth === Infinity ? "all" : state.depth);
  if ((state.view === "proc" || state.view === "deps") && state.direction !== "both") params.set("dir", state.direction);
  if (state.isolated) params.set("all", "1");
  location.hash = params.toString();
}
const open = id => go({ view: isModule(byId.get(id)) ? "module" : "proc", id });

// ---- cytoscape ------------------------------------------------------------
// Read from body, where the palette is taken from VS Code's theme.
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
// Edges are S-curves that leave and enter their nodes vertically: the
// control points sit level with the middle, above each end. Cytoscape takes
// them as a weight along the straight line and a distance away from it.
function sCurve(edge) {
  const s = edge.source().position(), t = edge.target().position();
  const dx = t.x - s.x, dy = t.y - s.y, length2 = dx * dx + dy * dy;
  if (length2 < 1) return { weights: [0.5], distances: [0] };
  const length = Math.sqrt(length2), bend = dx * dy / 2 / length;
  return { weights: [dy * dy / 2 / length2, (dx * dx + dy * dy / 2) / length2], distances: [bend, -bend] };
}
function cyStyle() {
  return [
    { selector: "node", style: {
      label: "data(label)", "font-size": 11, color: css("--text"), "text-valign": "center", "text-halign": "center",
      "text-wrap": "wrap", "background-color": css("--node"), "border-width": 1, "border-color": css("--node-border"),
      shape: "round-rectangle", width: "data(w)", height: "data(h)",
      "transition-property": "opacity, background-color, border-color", "transition-duration": 150 } },
    { selector: "node.module", style: { "font-weight": 600 } },
    { selector: "node.folder", style: { "font-weight": 600, "background-color": css("--group"), "border-width": 2 } },
    { selector: "node.external", style: { "border-style": "dashed", color: css("--muted") } },
    { selector: "node.main", style: { "border-color": css("--main"), "border-width": 2 } },
    { selector: "node.other", style: { color: css("--muted"), "border-style": "dashed" } },
    { selector: "node.more", style: { "border-width": 0, "background-opacity": 0, color: css("--muted") } },
    { selector: "node.focus", style: { "background-color": css("--accent-soft"), "border-color": css("--accent"), "border-width": 2 } },
    { selector: ":parent", style: {
      "background-color": css("--group"), "border-color": css("--line"), "text-valign": "top", "text-halign": "center",
      "font-size": 12, "font-weight": 600, color: css("--muted"), padding: 14, shape: "round-rectangle" } },
    { selector: ":parent.other", style: { "border-style": "dashed" } },
    { selector: "node.hover", style: { "background-color": css("--accent-soft"), "border-color": css("--accent") } },
    { selector: "node:selected", style: { "border-color": css("--accent"), "border-width": 3 } },
    { selector: "edge", style: {
      width: "data(width)", "line-color": css("--edge"), "target-arrow-color": css("--edge"),
      "target-arrow-shape": "triangle", "arrow-scale": 0.9, "curve-style": "unbundled-bezier",
      "control-point-weights": edge => sCurve(edge).weights, "control-point-distances": edge => sCurve(edge).distances,
      "transition-property": "opacity, line-color, target-arrow-color", "transition-duration": 150 } },
    { selector: "edge:loop", style: { "curve-style": "bezier" } },
    { selector: "edge.imports", style: { "line-style": "dashed", "line-color": css("--imports"), "target-arrow-color": css("--imports") } },
    // Edges inside one layer bend out up or down, further the longer they are,
    // so they don't run through the nodes in between.
    { selector: "edge.inner", style: { "curve-style": "unbundled-bezier", "control-point-weights": [0.5],
      "control-point-distances": edge => 25 + 0.45 * Math.abs(edge.source().position("x") - edge.target().position("x")) } },
    { selector: "edge.inner.defines", style: {
      "control-point-distances": edge => -(25 + 0.45 * Math.abs(edge.source().position("x") - edge.target().position("x"))) } },
    { selector: "edge.defines", style: { "line-style": "dotted", "target-arrow-shape": "none" } },
    { selector: "edge:selected", style: { "line-color": css("--accent"), "target-arrow-color": css("--accent") } },
    { selector: ".faded", style: { opacity: 0.15 } },
  ];
}

const cy = cytoscape({
  container: document.getElementById("cy"), style: cyStyle(), wheelSensitivity: 0.3,
  minZoom: 0.05, maxZoom: 3, boxSelectionEnabled: false,
});
// The panes get their sizes after the first draw, and the sashes move.
// Resizing clears the canvas and Cytoscape redraws only on a later frame,
// so it draws here, before the browser paints the blank canvas.
new ResizeObserver(() => { cy.resize(); fit(); cy.renderer().render(); }).observe(document.getElementById("cy"));
cytoscape.use(cytoscapeFcose);
// VS Code switches themes by changing the body's class.
new MutationObserver(() => cy.style(cyStyle())).observe(document.body, { attributes: true, attributeFilter: ["class"] });

// The width nodeData gives the widest of these nodes.
const widest = (ids, withModule = false) => Math.max(44, ...ids.map(id =>
  Math.max(label(id).length, withModule && isProc(byId.get(id)) ? (moduleOf(id) || "").length : 0) * 7 + 18));

function nodeData(id, extra = {}) {
  const n = byId.get(id);
  const text = extra.label || (isProc(n) && extra.withModule ? `${n.name}\n${moduleOf(id) || ""}` : label(id));
  const lines = text.split("\n");
  return {
    data: { id, label: text, w: Math.max(44, Math.max(...lines.map(l => l.length)) * 7 + 18), h: 14 * lines.length + 14, ...extra.data },
    classes: [n ? n.kind : "", n && isMain(n) ? "main" : "", ...(extra.classes || [])].join(" "),
    position: extra.position,
  };
}
const edgeData = (source, target, kind, weight = 1) => ({
  data: { id: `${kind}:${source}->${target}`, source, target, width: Math.min(6, 1 + Math.log2(weight)) },
  classes: kind,
});

const nodeRef = node => node.data("ref") || node.id();
cy.on("tap", "node", event => { const id = nodeRef(event.target); if (byId.has(id)) showDetails(id); });
cy.on("dbltap", "node", event => {
  const id = nodeRef(event.target);
  if (id.startsWith("dir:")) go({ view: "overview", id: id.slice(4) || null });
  else if (route().view === "deps" && isModule(byId.get(id))) go({ id });
  else if (byId.has(id)) open(id);
});
cy.on("tap", event => { if (event.target === cy) showDetails(route().id); });
cy.on("mouseover", "node", event => {
  const node = event.target;
  if (node.isParent()) return;
  node.addClass("hover");
  cy.elements().addClass("faded");
  const near = node.closedNeighborhood();
  near.union(near.ancestors()).removeClass("faded");
});
cy.on("mouseout", "node", () => cy.elements().removeClass("faded hover"));

// ---- views ----------------------------------------------------------------
// One folder: its subfolders and its own modules, with the calls and includes
// between them summed up. Past 300 items VS Code sends only the most
// connected: a force layout of 20,000 modules never finishes, and could not
// be read if it did. Search and the module list reach the rest.
function overview(state, data) {
  const inside = state.id ? `${state.id}/` : "";
  remember(data.modules);
  const elements = [
    ...data.folders.map(f => nodeData(f.id, { label: `${f.id.slice(4 + inside.length)}/\n${f.modules} modules`, classes: ["folder"] })),
    ...data.modules.map(n => nodeData(n.id)),
    ...data.edges.map(([a, b, kind, weight]) => edgeData(a, b, kind, weight)),
  ];
  const notes = [];
  if (data.folders.length) notes.push(`${data.folders.length} folders`);
  notes.push(`${data.modules.length} modules`);
  if (data.modules.length < data.connected) notes.push(`the ${data.modules.length} most connected of ${data.connected}; search finds the rest`);
  if (data.unlinked) notes.push(`${data.unlinked} without links hidden`);
  return {
    elements,
    // fcose: force-directed, edges act as springs, so linked modules end up close together.
    layout: { name: "fcose", animate: false, randomize: true, quality: elements.length > 1500 ? "draft" : "default",
              nodeRepulsion: () => 400000, idealEdgeLength: () => 220, edgeElasticity: () => 0.3, nodeDimensionsIncludeLabels: true,
              nodeSeparation: 140, gravity: 0.15, numIter: 3000, packComponents: true },
    status: `${notes.join(", ")} · double-click to open`,
  };
}

function moduleView(state, graph) {
  useGraph(graph);
  const moduleId = state.id;
  const own = graph.nodes.filter(n => isProc(n) && n.path === moduleId).map(n => n.id);
  const ownSet = new Set(own);
  const side = new Map();  // procedure outside the module -> layer: -1 callers above, 1 callees below
  for (const id of own) for (const target of callees.get(id) || []) if (!ownSet.has(target)) side.set(target, 1);
  for (const id of own) for (const source of callers.get(id) || []) if (!ownSet.has(source) && !side.has(source)) side.set(source, -1);
  // The module calling its own procedures from the top level is drawn once, in the middle.
  side.delete(moduleId);

  const LAYER_GAP = 170, STEP = widest([...own, ...side.keys()]) + 24, GROUP_GAP = 60, SIDE_LIMIT = 60;
  const elements = [];
  const x = new Map();
  const add = (id, parent, layer) => elements.push(nodeData(id, {
    classes: parent === moduleId ? [] : ["other"], data: parent ? { parent } : {},
    position: { x: x.get(id), y: layer * LAYER_GAP },
  }));

  // Middle layer: the module's own procedures in source order.
  own.sort((a, b) => (byId.get(a).line || 0) - (byId.get(b).line || 0));
  own.forEach((id, i) => x.set(id, (i - (own.length - 1) / 2) * STEP));
  elements.push(nodeData(moduleId, { classes: ["focus"], position: { x: 0, y: 0 } }));
  for (const id of own) add(id, moduleId, 0);

  // Outer layers: each outside procedure wants to sit straight above or below
  // the average of the procedures it connects to (barycenter), modules ordered
  // by their members' average; then push right just enough to avoid overlaps.
  const placeSide = layer => {
    let ids = [...side].filter(([, l]) => l === layer).map(([id]) => id);
    // A widely used module has thousands of callers; draw the most connected.
    const more = Math.max(0, ids.length - SIDE_LIMIT);
    if (more) {
      const links = new Map(ids.map(id => [id, [...(callees.get(id) || []), ...(callers.get(id) || [])].filter(n => ownSet.has(n)).length]));
      ids.sort((a, b) => links.get(b) - links.get(a));
      for (const id of ids.slice(SIDE_LIMIT)) side.delete(id);
      ids = ids.slice(0, SIDE_LIMIT);
    }
    const want = new Map(ids.map(id => {
      const xs = [...(callees.get(id) || []), ...(callers.get(id) || [])].filter(n => ownSet.has(n)).map(n => x.get(n));
      return [id, xs.reduce((a, b) => a + b, 0) / xs.length];
    }));
    const groups = new Map();
    for (const id of ids) push(groups, moduleOf(id) || "", id);
    const mean = list => list.reduce((a, id) => a + want.get(id), 0) / list.length;
    const order = [...groups.keys()].sort((a, b) => mean(groups.get(a)) - mean(groups.get(b)));
    let cursor = -Infinity, drift = 0;
    for (const group of order) {
      const members = groups.get(group).sort((a, b) => want.get(a) - want.get(b));
      const left = Math.max(cursor, mean(members) - (members.length - 1) / 2 * STEP);
      members.forEach((id, i) => { x.set(id, left + i * STEP); drift += want.get(id) - x.get(id); });
      cursor = left + members.length * STEP + GROUP_GAP;
    }
    // Overlap pushes layers right; shift back so they stay centred on their targets.
    for (const id of ids) x.set(id, x.get(id) + drift / Math.max(1, ids.length));
    // A module can show up in both outer layers, so each layer gets its own box.
    for (const group of order) {
      const box = group && `${group} @${layer}`;
      if (box) elements.push(nodeData(box, { label: group, classes: ["module", "other"], data: { ref: group } }));
      for (const id of groups.get(group)) add(id, box, layer);
    }
    if (more) elements.push({
      data: { id: `more:${layer}`, label: `… ${more} more`, w: 120, h: 28 }, classes: "more",
      position: { x: Math.max(...ids.map(id => x.get(id))) + STEP + GROUP_GAP, y: layer * LAYER_GAP },
    });
    hiddenCount += more;
  };
  let hiddenCount = 0;
  placeSide(-1);
  placeSide(1);

  for (const id of own) {
    for (const target of new Set(callees.get(id) || [])) {
      if (!ownSet.has(target) && !side.has(target)) continue;
      const edge = edgeData(id, target, "calls");
      if (ownSet.has(target)) edge.classes += " inner";
      elements.push(edge);
    }
    for (const source of new Set(callers.get(id) || [])) if (!ownSet.has(source) && side.has(source)) elements.push(edgeData(source, id, "calls"));
    const parent = parentOf.get(id);
    if (ownSet.has(parent)) elements.push(edgeData(parent, id, "defines inner"));
  }
  return {
    elements,
    layout: { name: "preset", fit: true, padding: 40 },
    status: `${own.length} procedures in ${moduleId} · callers above, callees below${hiddenCount ? ` · ${hiddenCount} less connected not drawn, the details list them` : ""} · double-click to follow`,
  };
}

// Barycenter ordering, the core step of a layered (Sugiyama) layout: sort each
// layer by the average place of its neighbours in the other layers, so edges
// run as straight as possible. A few sweeps outward and back let it settle.
function orderColumns(columns, neighbours) {
  const columnOf = new Map(), row = new Map();
  for (const [column, ids] of columns) for (const id of ids) columnOf.set(id, column);
  const place = ids => ids.forEach((id, i) => row.set(id, i - (ids.length - 1) / 2));
  for (const ids of columns.values()) place(ids);
  const outward = [...columns.keys()].filter(c => c !== 0).sort((a, b) => Math.abs(a) - Math.abs(b));
  for (let sweep = 0; sweep < 6; sweep++) {
    for (const column of sweep % 2 ? [...outward].reverse() : outward) {
      const ids = columns.get(column);
      const score = new Map(ids.map(id => {
        const rows = neighbours(id).filter(n => columnOf.has(n) && columnOf.get(n) !== column).map(n => row.get(n));
        return [id, rows.length ? rows.reduce((a, b) => a + b) / rows.length : row.get(id)];
      }));
      ids.sort((a, b) => score.get(a) - score.get(b));
      place(ids);
    }
  }
}

// VS Code sends the procedures `depth` calls away, or the modules a module
// uses or is used by; this walks them again to put each on the level it is
// reached at first, what it uses below, what uses it above.
function procView(state, graph) {
  useGraph(graph);
  const focus = state.id;
  const level = new Map([[focus, 0]]);
  const walk = (neighbours, sign) => {
    const seen = new Set([focus]);
    let frontier = [focus];
    for (let depth = 1; depth <= state.depth && frontier.length; depth++) {
      const next = [];
      for (const id of frontier) for (const other of neighbours.get(id) || []) {
        if (seen.has(other)) continue;
        seen.add(other);
        next.push(other);
        if (!level.has(other)) level.set(other, sign * depth);
      }
      frontier = next;
    }
  };
  if (state.direction !== "up") walk(callees, 1);
  if (state.direction !== "down") walk(callers, -1);

  const columns = new Map();
  for (const [id, column] of level) push(columns, column, id);
  const elements = [];
  const PER_COLUMN = 60, LAYER_GAP = 150, STEP = widest([...level.keys()], true) + 24;
  for (const ids of columns.values()) ids.sort((a, b) => label(a).localeCompare(label(b)));
  orderColumns(columns, id => [...(callees.get(id) || []), ...(callers.get(id) || [])]);
  // Rows fill outward from the focus, and a node is drawn only when the one
  // it was reached from is: otherwise a full row leaves it hanging unconnected.
  const drawn = new Set([focus]);
  for (const column of [...columns.keys()].sort((a, b) => Math.abs(a) - Math.abs(b))) {
    const ids = columns.get(column);
    const from = column > 0 ? callers : callees;
    const shown = column === 0 ? ids : ids.filter(id => (from.get(id) || []).some(n => drawn.has(n) && level.get(n) === column - Math.sign(column))).slice(0, PER_COLUMN);
    for (const id of shown) drawn.add(id);
    const more = ids.length - shown.length;
    const rows = shown.length + (more ? 1 : 0);
    shown.forEach((id, row) => elements.push(nodeData(id, {
      withModule: true, classes: id === focus ? ["focus"] : [],
      position: { x: (row - (rows - 1) / 2) * STEP, y: column * LAYER_GAP },
    })));
    if (more) elements.push({
      data: { id: `more:${column}`, label: `… ${more} more`, w: 120, h: 28 }, classes: "more",
      position: { x: (rows - 1 - (rows - 1) / 2) * STEP, y: column * LAYER_GAP },
    });
  }
  const shownIds = new Set(elements.map(e => e.data.id));
  for (const id of shownIds) for (const target of callees.get(id) || []) {
    if (shownIds.has(target)) elements.push(edgeData(id, target, includes.has(`${id}>${target}`) ? "imports" : "calls"));
  }
  const up = [...level.values()].filter(v => v < 0).length, down = [...level.values()].filter(v => v > 0).length;
  const counts = state.view === "deps" ? `${up} modules using ${focus} above, ${down} it uses below`
    : `${up} callers above ${byId.get(focus).name}, ${down} callees below, depth ${state.depth === Infinity ? "all" : state.depth}`;
  return {
    elements,
    layout: { name: "preset", fit: true, padding: 40 },
    status: `${counts} · double-click to refocus`,
  };
}

// ---- flow page ------------------------------------------------------------
// A procedure's statements as a UML activity diagram, control flowing down,
// with a lane for each procedure and include it goes through. Branches sit
// side by side in slots, columns that all lanes share, so nothing overlaps;
// a lane drops the slots it does not use.
const FLOW = { slot: 272, box: 232, gap: 40, line: 15, small: 13 };
const FLOW_MARK = { cut: " ⋔", external: " ⋔", recursive: " ↻", missing: " ?" };
let flowCanvas = null;
// Greedy wrap to `px` pixels after spaces, commas and parentheses, breaking
// words that are wider by themselves.
// A line break in the text always breaks; `code` measures in the monospace font.
function wrap(text, px, size, most = 30, code = false) {
  flowCanvas ??= document.createElement("canvas").getContext("2d");
  flowCanvas.font = `${size}px ${getComputedStyle(document.body).getPropertyValue(code ? "--code-font" : "font-family")}`;
  const fits = s => flowCanvas.measureText(s).width <= px;
  const lines = [];
  for (const given of text.split("\n")) wrapLine(given, fits, lines);
  if (lines.length > most) lines.splice(most - 1, Infinity, `${lines[most - 1]}…`);
  return lines;
}
function wrapLine(text, fits, lines) {
  let line = "";
  for (let word of text.split(/(?<=[ ,(])/)) {
    if (fits((line + word).trimEnd())) { line += word; continue; }
    if (line) lines.push(line.trimEnd());
    word = word.trimStart();
    while (!fits(word)) {
      let cut = word.length - 1;
      while (cut > 1 && !fits(word.slice(0, cut))) cut--;
      lines.push(word.slice(0, cut));
      word = word.slice(cut);
    }
    line = word;
  }
  if (line.trim()) lines.push(line.trimEnd());
}
const FLOW_TONES = { true: "true", false: "false" };
const FLOW_ENDS = new Set(["stop", "goto", "iterate", "leave", "return"]);
function layoutFlow(flow) {
  const nodes = [], edges = [];
  const add = (type, step, lane, row, slot, extra) => nodes.push({ type, step, lane, row, slot, ...extra }) - 1;
  // An IF's true and false branches keep their color down to the next step.
  const link = (ends, to) => { for (const end of ends) edges.push({ from: end.node, to, guard: end.guard, route: end.route || "down", tone: end.tone ?? FLOW_TONES[end.guard] }); };
  // Places the steps from `row` down in `slot`; returns the open ends, the
  // next free row and the right-most slot used. A RETURN goes back to the
  // caller and a LEAVE out of its loop, both along the right of their slot.
  function place(steps, row, slot, ends, context) {
    let last = slot;
    for (const step of steps) {
      if (step.branches) {
        const decision = add("decision", step, step.lane, row, slot, { nest: context.loops.length + 1 });
        link(ends, decision);
        const open = [];
        let next = slot, bottom = row + 1;
        for (const branch of step.branches) {
          const into = [{ node: decision, guard: branch.guard }];
          // An IF's empty branch leaves the diamond to the side and runs down to whatever comes next.
          if (!branch.steps.length && step.kind === "if") {
            open.push({ node: decision, guard: branch.guard, route: "exit" });
            continue;
          }
          // Any other empty branch still gets a slot, so its edge does not run through the other branches.
          const placed = branch.steps.length ? place(branch.steps, row + 1, next, into, context)
            : { ends: [{ node: add("pass", step, step.lane, row + 1, next), tone: FLOW_TONES[branch.guard] }], row: row + 2, last: next };
          if (!branch.steps.length) link(into, placed.ends[0].node);
          open.push(...placed.ends);
          bottom = Math.max(bottom, placed.row);
          last = Math.max(last, placed.last);
          next = placed.last + 1;
        }
        // The branches go straight on to the next step, without a merge node.
        ends = open;
        row = bottom;
      } else if (step.kind === "loop") {
        // One decision: true runs the body and comes back, false leaves along the right.
        const head = add("decision", step, step.lane, row, slot, { nest: context.loops.length });
        link(ends, head);
        const loop = { exits: [] };
        const body = place(step.steps, row + 1, slot, [{ node: head, guard: "true" }], { ...context, loops: [...context.loops, loop] });
        link(body.ends.map(end => end.route === "exit" ? { ...end, route: "side-back" } : { node: end.node, route: "back", tone: "" }), head);
        nodes[head].bodyEnd = body.row;
        const exit = add("pass", step, step.lane, body.row, slot);
        link([{ node: head, guard: "false", route: "exit" }, ...loop.exits], exit);
        ends = [{ node: exit, tone: "false" }];
        last = Math.max(last, body.last);
        row = body.row + 1;
      } else {
        const node = add("action", step, step.lane, row, slot);
        link(ends, node);
        ends = [{ node }];
        row++;
        if (step.steps?.length) {
          // A callee's RETURN comes back here; code in an include returns from the includer.
          const callee = step.kind === "call" ? { returns: [], loops: [] } : context;
          const inner = place(step.steps, row, slot, ends, callee);
          ends = step.kind === "call" ? [...inner.ends, ...callee.returns] : inner.ends;
          last = Math.max(last, inner.last);
          row = inner.row;
        } else if (step.kind === "return") {
          context.returns.push({ node, route: "jump" });
          ends = [];
        } else if (step.kind === "leave" && context.loops.length) {
          context.loops.at(-1).exits.push({ node, route: "jump" });
          ends = [];
        } else if (FLOW_ENDS.has(step.kind)) {
          nodes[node].end = step.kind === "stop" ? "activity" : "flow";
          ends = [];
        }
      }
    }
    return { ends, row, last };
  }
  const top = { returns: [], loops: [] };
  const start = add("initial", null, 0, 0, 0);
  const body = place(flow.steps, 1, 0, [{ node: start }], top);
  const final = add("final", null, 0, body.row, 0);
  link([...body.ends, ...top.returns], final);

  // Each lane keeps only its used slots, in order.
  const used = flow.lanes.map(() => new Set());
  for (const n of nodes) used[n.lane].add(n.slot);
  const column = used.map(slots => new Map([...slots].sort((a, b) => a - b).map((slot, i) => [slot, i])));
  const laneX = [];
  let width = 0;
  for (let lane = 0; lane < flow.lanes.length; lane++) { laneX.push(width); width += Math.max(1, used[lane].size) * FLOW.slot; }
  // Text wraps, so a row is as tall as its tallest node, and the gap above
  // it as tall as the longest guard going into it.
  const space = new Array(body.row + 1).fill(0), gap = new Array(body.row + 1).fill(FLOW.gap);
  for (const n of nodes) {
    n.left = laneX[n.lane] + column[n.lane].get(n.slot) * FLOW.slot;
    n.x = n.left + FLOW.slot / 2;
    // An IF, SELECT or DO shows its statement in a box above its diamond.
    n.boxed = n.type === "decision";
    if (n.type === "action") n.lines = wrap(n.step.text + (FLOW_MARK[n.step.call] || ""), FLOW.box - 16, 12, 40, true);
    if (n.boxed) n.lines = wrap(n.step.text, FLOW.box - 16, 12, 40, true);
    n.boxH = n.lines ? n.lines.length * FLOW.line + 13 : 0;
    n.h = n.type === "action" ? n.boxH : n.boxed ? n.boxH + 8 + 24 : { decision: 24, initial: 18, final: 22, pass: 0 }[n.type];
    space[n.row] = Math.max(space[n.row], n.h + (n.end ? 22 : 0));
  }
  for (const e of edges) {
    if (!e.guard) continue;
    e.lines = wrap(`[${e.guard}]`, FLOW.slot / 2 - 14, 11);
    if (e.route === "exit" || e.route === "side-back") continue;
    const row = nodes[e.to].row;
    gap[row] = Math.max(gap[row], FLOW.gap + e.lines.length * FLOW.small);
  }
  const rowTop = [0];
  for (let row = 0; row <= body.row; row++) rowTop.push(rowTop[row] + gap[row] + space[row]);
  for (const n of nodes) {
    n.rowTop = rowTop[n.row];
    n.top = n.rowTop + gap[n.row];
    if (n.bodyEnd) n.loopBottom = rowTop[n.bodyEnd];
    n.y = n.type === "decision" ? n.top + n.h - 12 : n.top + n.h / 2;
  }
  return { nodes, edges, laneX, width, height: rowTop[body.row + 1] + FLOW.gap };
}

const SVG = "http://www.w3.org/2000/svg";
function svg(tag, props, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [key, value] of Object.entries(props || {})) node.setAttribute(key, value);
  for (const child of children) if (child != null) node.append(child);
  return node;
}
const titled = text => svg("title", null, text);
// Lines of text, the first baseline at y.
const lines = (texts, x, y, step, props, title) =>
  svg("text", props, ...texts.map((text, i) => svg("tspan", { x, y: y + i * step }, text)), title ? titled(title) : null);

function drawFlow(flow, layout) {
  const { nodes, edges, laneX, width, height } = layout;
  const lanes = el("div", { class: "flow-lanes", style: `width: ${width}px` });
  flow.lanes.forEach((lane, i) => {
    const right = i + 1 < laneX.length ? laneX[i + 1] : width;
    lanes.append(el("div", { class: lane.kind, style: `left: ${laneX[i]}px; width: ${right - laneX[i]}px`, title: `${lane.name} · ${lane.path}:${lane.line}`,
      onclick: () => lane.kind === "include" ? host.postMessage({ type: "open", path: lane.path, line: 1 }) : go({ view: "flow", id: lane.id }) },
      el("b", null, lane.name), el("span", { class: "sub" }, lane.kind === "include" ? `include · ${lane.path}` : lane.path)));
  });
  const root = svg("svg", { width, height, viewBox: `0 0 ${width} ${height}` },
    svg("defs", null, ...["", "true", "false"].map(tone => svg("marker", { id: `flow-arrow${tone ? `-${tone}` : ""}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
      svg("path", { d: "M0,0 L10,5 L0,10 z", class: `arrow ${tone}` })))));
  flow.lanes.forEach((lane, i) => {
    const right = i + 1 < laneX.length ? laneX[i + 1] : width;
    if (i % 2) root.append(svg("rect", { x: laneX[i], y: 0, width: right - laneX[i], height, class: "lane-odd" }));
    if (i) root.append(svg("line", { x1: laneX[i], y1: 0, x2: laneX[i], y2: height, class: "lane-line" }));
  });
  // Where edges share a stretch, the colored one is drawn last, so it shows on top.
  for (const e of [...edges].sort((x, y) => !!x.tone - !!y.tone)) {
    const a = nodes[e.from], b = nodes[e.to];
    const top = b.top;
    let d;
    // Side lines step inwards per loop around them, so they don't run on top of each other.
    const side = a.left + FLOW.slot - 6 - (a.nest ?? 0) * 4;
    if (e.route === "back") {
      d = `M${a.x},${a.top + a.h} V${b.loopBottom + 10} H${b.left + 6 + b.nest * 4} V${b.y} H${b.x - 12}`;
    } else if (e.route === "side-back" && a.slot === b.slot) {
      d = `M${a.x - 12},${a.y} H${b.left + 6 + b.nest * 4} V${b.y} H${b.x - 12}`;
    } else if (e.route === "side-back") {
      d = `M${a.x + 12},${a.y} H${side} V${b.loopBottom + 10} H${b.left + 6 + b.nest * 4} V${b.y} H${b.x - 12}`;
    } else if (e.route === "jump" || e.route === "exit") {
      const x = e.route === "exit" ? side : a.left + FLOW.slot - 6;
      d = `M${a.x + (e.route === "exit" ? 12 : FLOW.box / 2)},${a.y} H${x} V${top - 10} H${b.x} V${top}`;
    } else {
      const bottom = a.top + a.h;
      d = a.x === b.x ? `M${a.x},${bottom} V${top}` : `M${a.x},${bottom} V${b.rowTop + 10} H${b.x} V${top}`;
    }
    const tone = e.tone || "";
    root.append(svg("path", { d, class: `edge ${tone}`, "marker-end": b.type === "pass" ? "" : `url(#flow-arrow${tone ? `-${tone}` : ""})` }));
    if (e.lines && e.route === "side-back" && a.slot === b.slot) root.append(lines(e.lines, a.x - 16, a.y - 5 - (e.lines.length - 1) * FLOW.small, FLOW.small, { class: `guard ${e.tone || ""}`, "text-anchor": "end" }, e.guard));
    else if (e.lines && (e.route === "exit" || e.route === "side-back")) root.append(lines(e.lines, a.x + 16, a.y - 5 - (e.lines.length - 1) * FLOW.small, FLOW.small, { class: `guard ${e.tone || ""}` }, e.guard));
    else if (e.lines) root.append(lines(e.lines, b.x + 6, top - 6 - (e.lines.length - 1) * FLOW.small, FLOW.small, { class: `guard ${e.tone || ""}` }, e.guard));
  }
  const goTo = step => () => host.postMessage({ type: "open", path: step.path, line: step.line });
  for (const n of nodes) {
    if (n.type === "initial") root.append(svg("circle", { cx: n.x, cy: n.y, r: 9, class: "dot" }));
    else if (n.type === "final") root.append(svg("circle", { cx: n.x, cy: n.y, r: 11, class: "ring" }), svg("circle", { cx: n.x, cy: n.y, r: 6, class: "dot" }));
    else if (n.type === "decision") {
      const where = `${n.step.text} · ${n.step.path}:${n.step.line}`;
      if (n.boxed) {
        const box = svg("g", { class: "act cond" },
          svg("rect", { x: n.x - FLOW.box / 2, y: n.top, width: FLOW.box, height: n.boxH, rx: 2 }),
          n.lines.length > 1 ? lines(n.lines, n.x - FLOW.box / 2 + 8, n.top + 17, FLOW.line, {}) : lines(n.lines, n.x, n.top + 17, FLOW.line, { "text-anchor": "middle" }),
          titled(where));
        box.addEventListener("click", goTo(n.step));
        root.append(box, svg("line", { x1: n.x, y1: n.top + n.boxH, x2: n.x, y2: n.y - 12, class: "edge" }));
      }
      const diamond = svg("polygon", { points: `${n.x},${n.y - 12} ${n.x + 12},${n.y} ${n.x},${n.y + 12} ${n.x - 12},${n.y}`, class: "diamond" }, titled(where));
      diamond.addEventListener("click", goTo(n.step));
      root.append(diamond);
    } else if (n.type === "action") {
      const step = n.step;
      const kind = step.call === "missing" ? "missing" : step.kind === "include" ? "include" : step.call ? "call" : n.end ? "ends" : "";
      const box = svg("g", { class: `act ${kind}` },
        svg("rect", { x: n.x - FLOW.box / 2, y: n.top, width: FLOW.box, height: n.h, rx: 8 }),
        n.lines.length > 1 ? lines(n.lines, n.x - FLOW.box / 2 + 8, n.top + 17, FLOW.line, {}) : lines(n.lines, n.x, n.top + 17, FLOW.line, { "text-anchor": "middle" }),
        titled(`${step.text}${step.call && step.call !== "expanded" ? ` (${step.call === "cut" ? "deeper than the slider" : step.call})` : ""} · ${step.path}:${step.line}`));
      box.addEventListener("click", goTo(step));
      root.append(box);
      // Below the action: a flow final, or an activity final for STOP.
      const y = n.top + n.h + 12;
      if (n.end) root.append(svg("line", { x1: n.x, y1: n.top + n.h, x2: n.x, y2: y - 6, class: "edge" }));
      if (n.end === "activity") root.append(svg("circle", { cx: n.x, cy: y, r: 6, class: "ring" }), svg("circle", { cx: n.x, cy: y, r: 3, class: "dot" }));
      if (n.end === "flow") root.append(svg("circle", { cx: n.x, cy: y, r: 6, class: "ring" }),
        svg("path", { d: `M${n.x - 4},${y - 4} L${n.x + 4},${y + 4} M${n.x - 4},${y + 4} L${n.x + 4},${y - 4}`, class: "ring" }));
    }
  }
  document.getElementById("flow-body").replaceChildren(lanes, root);
}

let flowId = null, flowAsked = 0;
function showFlow(id) {
  flowId = id;
  document.getElementById("flow-title").textContent = `Flow of ${id.replace(/^.*:(.*):\d+$/, "$1")}`;
  document.getElementById("flow-body").replaceChildren();
  renderFlow();
}
async function renderFlow() {
  const mine = ++flowAsked;
  const depth = Number(document.getElementById("flow-depth").value);
  document.getElementById("flow-depth-value").textContent = String(depth);
  const status = document.getElementById("flow-status"), error = document.getElementById("flow-error");
  const fail = (code, message, cause) => {
    console.error(`[${code}] ${message}`, cause || "");
    error.textContent = `[${code}] ${message}`;
    error.hidden = false;
    status.textContent = "";
  };
  error.hidden = true;
  status.textContent = "reading the graph…";
  const started = performance.now();
  let flow;
  try {
    flow = await ask("flow", flowId, depth);
  } catch (cause) {
    if (mine === flowAsked) fail("VIZ-107", `could not read the flow of ${flowId}: ${cause.message}`, cause);
    return;
  }
  if (mine !== flowAsked) return;
  if (!flow) return fail("VIZ-108", `"${flowId}" is not in this graph`);
  try {
    const read = performance.now();
    const layout = layoutFlow(flow);
    drawFlow(flow, layout);
    const actions = layout.nodes.filter(n => n.type === "action").length;
    status.textContent = `${flow.lanes.length} lanes · ${actions} steps${flow.truncated ? " · deeper calls cut off at 3000 steps" : ""}`;
    host.postMessage({ type: "route", hash: location.hash.slice(1), title: `PL/I Flow: ${flowId.replace(/^.*:(.*):\d+$/, "$1")}`, drawMs: Math.round(performance.now() - read), sinceLoadMs: Math.round(performance.now()) });
    console.info(`[graph] flow ${flowId} depth ${depth}: ${flow.lanes.length} lanes, ${layout.nodes.length} nodes, read in ${Math.round(read - started)} ms, drawn in ${Math.round(performance.now() - read)} ms`);
  } catch (cause) {
    fail("VIZ-109", `could not draw the flow of ${flowId}: ${cause.message}`, cause);
  }
}
document.getElementById("flow-depth").addEventListener("input", renderFlow);

// ---- render ---------------------------------------------------------------
const views = {
  overview: { draw: overview, read: state => ask("overview", state.id || "", state.isolated) },
  module: { draw: moduleView, read: state => ask("module", state.id) },
  proc: { draw: procView, read: state => ask("procedure", state.id, state.depth === Infinity ? 0 : state.depth, state.direction) },
  deps: { draw: (state, graph) => procView({ ...state, depth: Infinity }, graph), read: state => ask("dependencies", state.id, state.direction) },
};
let drawn = 0;
async function render() {
  const mine = ++drawn;
  const state = route();
  if (!views[state.view]) state.view = "overview";
  document.getElementById("error").hidden = true;
  document.getElementById("status").textContent = "reading the graph…";
  const started = performance.now();
  try {
    let data = await views[state.view].read(state);
    if (mine !== drawn) return;
    if (data === null) {
      showError("VIZ-101", `"${state.id}" is not in this graph; showing all modules`);
      state.view = "overview";
      state.id = null;
      data = await views.overview.read(state);
      if (mine !== drawn) return;
    }
    const read = performance.now();
    const view = views[state.view].draw(state, data);
    cy.batch(() => { cy.elements().remove(); cy.add(view.elements); });
    cy.layout(view.layout).run();
    fit();
    document.getElementById("status").textContent = view.status;
    console.info(`[graph] ${state.view} ${state.id || ""}: ${view.elements.length} elements, read in ${Math.round(read - started)} ms, drawn in ${Math.round(performance.now() - read)} ms`);
  } catch (error) {
    if (mine !== drawn) return;
    document.getElementById("status").textContent = "";
    showError("VIZ-102", `could not draw the ${state.view} view: ${error.message}`, error);
  }
  document.getElementById("depth").hidden = state.view !== "proc";
  for (const b of document.querySelectorAll("#depth vscode-button")) b.secondary = (b.dataset.depth === "all" ? Infinity : Number(b.dataset.depth)) !== state.depth;
  document.getElementById("direction").hidden = state.view !== "proc" && state.view !== "deps";
  for (const b of document.querySelectorAll("#direction vscode-button")) b.secondary = b.dataset.direction !== state.direction;
  document.getElementById("save-tool").hidden = state.view !== "proc" && state.view !== "deps";
  document.getElementById("deps-tool").hidden = state.view !== "module" && state.view !== "deps";
  document.getElementById("deps").textContent = state.view === "deps" ? "Procedures" : "Dependencies";
  document.getElementById("isolated-tool").hidden = state.view !== "overview";
  document.getElementById("isolated").secondary = !state.isolated;
  renderCrumbs(state);
  showDetails(state.id);
  if (state.id && cy.getElementById(state.id).nonempty()) cy.getElementById(state.id).select();
  host.postMessage({ type: "route", hash: location.hash.slice(1), drawMs: Math.round(performance.now() - started), sinceLoadMs: Math.round(performance.now()) });
}

// The split layouts measure the panel only once it is drawn.
requestAnimationFrame(() => {
  const width = document.body.clientWidth;
  const left = Math.round(Math.min(260, width * 0.25)), right = Math.round(Math.min(320, width * 0.3));
  document.getElementById("sides").handlePosition = `${left}px`;
  document.getElementById("details-side").handlePosition = `${width - left - right}px`;
});
// The flow tab is this page showing only the flow of the procedure in its hash.
if (flowPage) {
  document.body.classList.add("flow-page");
  document.getElementById("flow").hidden = false;
  document.querySelector(".flow-head").append(el("span", { class: "spacer" }), document.querySelector(".search"));
  search.placeholder = "Show the flow of procedure…  ( / )";
  window.addEventListener("hashchange", () => showFlow(route().id));
  showFlow(route().id);
} else {
  window.addEventListener("hashchange", render);
  renderList();
  render();
}
</script>
</body>
</html>
