<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3270 Screen</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        color: var(--vscode-foreground, #ccc);
        background: var(--vscode-editor-background, #1e1e1e);
        font-family: var(--vscode-font-family, sans-serif);
        font-size: var(--vscode-font-size, 13px);
      }
      vscode-split-layout {
        height: 100%;
        border: 0;
      }
      #terminal {
        position: relative;
        height: 100%;
        overflow: hidden;
        outline: none;
        background: #000;
      }
      #terminal:focus-visible {
        outline: 1px solid var(--vscode-focusBorder, #007fd4);
        outline-offset: -1px;
      }
      canvas {
        position: absolute;
        display: block;
      }
      aside {
        height: 100%;
        overflow: auto;
        box-sizing: border-box;
        padding: 8px 12px;
        background: var(--vscode-sideBar-background, #252526);
      }
      h2 {
        margin: 0;
        font-size: 1.1em;
      }
      #where {
        margin: 2px 0 12px;
        color: var(--vscode-descriptionForeground, #999);
      }
      #fields {
        display: grid;
        gap: 2px;
      }
      label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        cursor: pointer;
      }
      label span {
        color: var(--vscode-descriptionForeground, #999);
      }
      vscode-textfield {
        width: 100%;
        font-family: var(--vscode-editor-font-family, monospace);
      }
      #clear {
        margin-top: 12px;
      }
      .hint {
        color: var(--vscode-descriptionForeground, #999);
        margin-top: 16px;
        line-height: 1.5;
      }
      #error {
        margin: 8px 0;
        padding: 6px 8px;
        color: var(--vscode-inputValidation-errorForeground, #fff);
        background: var(--vscode-inputValidation-errorBackground, #5a1d1d);
        border: 1px solid var(--vscode-inputValidation-errorBorder, #be1100);
      }
    </style>
  </head>
  <body>
    <script id="initial" type="application/json">__SCREEN_JSON__</script>
    <vscode-split-layout id="split" fixed-pane="end" min-start="200px" min-end="160px">
      <main id="terminal" slot="start" tabindex="0"><canvas id="canvas"></canvas></main>
      <aside slot="end">
        <h2 id="title"></h2>
        <div id="where"></div>
        <div id="error" hidden></div>
        <div id="fields"></div>
        <vscode-button id="clear" secondary>Clear fields</vscode-button>
        <div class="hint">Enter, F1-F24 (Shift for 13-24), PageUp/PageDown for PA1/PA2. Insert toggles insert mode.</div>
      </aside>
    </vscode-split-layout>
    <script>/*__PAGE__*/</script>
  </body>
</html>
